<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Educativo - Catálogo Astronómico</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(18, 24, 48, 0.75);
            --primary: #00d9ff;
            --secondary: #d600ff;
            --accent: #ffb700;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --neon-glow: 0 0 12px rgba(0, 217, 255, 0.4), 0 0 25px rgba(214, 0, 255, 0.2);
            --max-width: 1200px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 217, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 60%, rgba(214, 0, 255, 0.06) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Estrellas animadas */
        .stars {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            animation: starsDrift 140s linear infinite;
            opacity: 0.5;
        }

        @keyframes starsDrift {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        /* Navegación / Tabs */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 2.5rem 1rem 1.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(18, 24, 48, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.3);
            color: var(--text-light);
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
            transform: translateY(-3px);
        }

        header {
            text-align: center;
            padding: 1rem 1rem 2rem;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 5vw, 4rem);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0 0 12px 0;
            text-shadow: 0 0 15px rgba(0,217,255,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Controles de búsqueda y filtros */
        .controls {
            display: none; /* Se activa según la pestaña */
            justify-content: center;
            gap: 20px;
            margin: 2rem auto 3rem;
            max-width: 850px;
            padding: 0 1.5rem;
            flex-wrap: wrap;
        }

        .input-group {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .controls input, .controls select {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border-radius: 14px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            background: rgba(7, 9, 19, 0.85);
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .controls input:focus, .controls select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }

        .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25rem;
            pointer-events: none;
            color: var(--primary);
        }

        main {
            flex: 1;
            padding: 0 2rem 5rem;
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }

        /* Grid de contenidos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        /* Tarjetas o "Pills" informativas */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0.7;
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 217, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .card:hover::before {
            height: 8px;
            opacity: 1;
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 66.66%; /* Proporción 3:2 exacta */
            background-color: #02040a;
            overflow: hidden;
        }

        .card-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-badge {
            position: absolute;
            top: 15px; left: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            background: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            z-index: 1;
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.3;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 24px;
            flex: 1;
            opacity: 0.9;
        }

        .card-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 0;
            background: rgba(0, 217, 255, 0.08);
            color: var(--primary);
            text-decoration: none;
            border-radius: 10px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
        }

        .card-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: var(--neon-glow);
            border-color: var(--primary);
        }

        /* Vista Detalle o Artículo Expandido */
        .detail-view {
            background: rgba(10, 14, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: fadeIn 0.4s ease;
            max-width: 900px;
            margin: 0 auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-img-wrapper {
            width: 100%;
            max-height: 450px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .detail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            line-height: 1.2;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(0,217,255,0.3);
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .detail-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        /* Reproductor de Video en detalle */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-light);
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(0,217,255,0.2);
        }

        /* Estado / Carga */
        .status-panel {
            grid-column: 1 / -1;
            background: var(--card-bg);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 20px;
            padding: 4rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .status-icon { font-size: 3rem; }
        .status-text { font-size: 1.2rem; color: var(--text-light); max-width: 500px; line-height: 1.5; }

        .loader {
            width: 60px; height: 60px;
            border: 4px solid rgba(0, 217, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pie de página - Uruguay Educa */
        footer {
            text-align: center;
            padding: 3rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
            background: rgba(3, 5, 12, 0.85);
            backdrop-filter: blur(12px);
        }

        footer a {
            display: inline-block;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        footer img {
            height: 65px;
            opacity: 0.6;
            transition: all 0.3s ease;
            filter: grayscale(100%) brightness(200%);
        }

        footer a:hover img {
            opacity: 1;
            filter: grayscale(0%) brightness(100%);
            transform: scale(1.05);
        }

        .footer-text {
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 217, 255, 0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .input-group { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <!-- Navegación de pestañas (Tabs) -->
    <nav>
        <button class="tab-btn active" onclick="switchTab('inicio')">Artículos</button>
        <button class="tab-btn" onclick="switchTab('recursos')">Recursos</button>
        <button class="tab-btn" onclick="switchTab('videos')">Videos</button>
    </nav>
    
    <header>
        <h1 id="mainTitle">Universo Educativo</h1>
        <p id="mainSubtitle" class="subtitle">Explora el cosmos del conocimiento.</p>
    </header>

    <!-- Controles de búsqueda -->
    <div id="controlsRecursos" class="controls">
        <div class="input-group">
            <span class="icon">🪐</span>
            <select id="topicFilterRecursos">
                <option value="all">Todas las categorías (Tipos)</option>
            </select>
        </div>
        <div class="input-group">
            <span class="icon">🛰️</span>
            <input type="text" id="textSearchRecursos" placeholder="Buscar en la descripción de recursos...">
        </div>
    </div>

    <div id="controlsVideos" class="controls">
        <div class="input-group">
            <span class="icon">🪐</span>
            <select id="topicFilterVideos">
                <option value="all">Todas las categorías (Temas)</option>
            </select>
        </div>
        <div class="input-group">
            <span class="icon">🛰️</span>
            <input type="text" id="textSearchVideos" placeholder="Buscar en la síntesis de videos...">
        </div>
    </div>

    <main>
        <div id="contentArea" class="grid">
            <div class="status-panel">
                <div class="loader"></div>
                <div class="status-text">Sincronizando con los servidores espaciales (Cargando datos en vivo)...</div>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://uruguayeduca.anep.edu.uy/" target="_blank" rel="noopener noreferrer">
            <img src="https://uruguayeduca.anep.edu.uy/sites/all/themes/uruguayeduca/logo.png" alt="Uruguay Educa Logo" onerror="this.onerror=null; this.src='https://uruguayeduca.anep.edu.uy/sites/default/files/inline-images/logo-uruguay-educa-2020.png';">
            <div class="footer-text">Portal Educativo - Uruguay Educa</div>
        </a>
    </footer>

    <script>
        // ID de la hoja de cálculo de Google Sheets accesible online
        const sheetId = '1kreViUIlvUqtE76T48OoUXNrbE7QnsLwO2Tey676SK8';
        
        // Estructura de URLs para extraer cada pestaña como CSV de manera robusta
        const sheets = {
            inicio: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=INICIO`,
            recursos: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=RECURSOS`,
            videos: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Videos`
        };

        // Contenedores de datos crudos descargados de las hojas
        let dataStore = { inicio: [], recursos: [], videos: [] };
        let activeTab = 'inicio';

        // Lógica para parsear todas las hojas desde Google Drive
        async function loadAllData() {
            try {
                // Parseamos las 3 hojas mediante PapaParse
                const p1 = parseSheet(sheets.inicio);
                const p2 = parseSheet(sheets.recursos);
                const p3 = parseSheet(sheets.videos);

                const [inicio, recursos, videos] = await Promise.all([p1, p2, p3]);
                
                // Filtrar filas inválidas que estén completamente vacías
                dataStore.inicio = inicio.filter(r => r.Título && r.Título.trim() !== '');
                dataStore.recursos = recursos.filter(r => r.Name && r.Name.trim() !== '');
                dataStore.videos = videos.filter(r => r.Título && r.Título.trim() !== '');

                // Inicializar la vista por defecto
                switchTab('inicio');
                setupListeners();
            } catch (err) {
                console.error("Error cargando datos:", err);
                showError("No se ha podido establecer comunicación con la base de datos central en la nube. Verifica que la URL sea pública.");
            }
        }

        function parseSheet(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        // Comprobar si Google Sheets arroja una página HTML de error de permisos
                        if(results.data.length > 0) {
                            const firstVal = Object.values(results.data[0])[0] || '';
                            if (typeof firstVal === 'string' && (firstVal.includes('<!DOCTYPE html>') || firstVal.includes('<html'))) {
                                return reject('Permiso de hoja de cálculo denegado o archivo no encontrado.');
                            }
                        }
                        resolve(results.data);
                    },
                    error: (err) => reject(err)
                });
            });
        }

        function showError(msg) {
            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div class="status-panel" style="border-color: rgba(214, 0, 255, 0.5);">
                    <div class="status-icon">⚠️</div>
                    <div class="status-text" style="color: #ff3366;"><strong>Fallo en la sincronización:</strong> ${msg}</div>
                </div>`;
        }

        // Cambio de pestañas (Artículos, Recursos, Videos)
        function switchTab(tabName) {
            activeTab = tabName;
            
            // Botones activos
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event && event.target.classList.add('active');

            // Ocultar/Mostrar controles
            document.getElementById('controlsRecursos').style.display = (tabName === 'recursos') ? 'flex' : 'none';
            document.getElementById('controlsVideos').style.display = (tabName === 'videos') ? 'flex' : 'none';

            // Textos descriptivos de cabecera
            const titleEl = document.getElementById('mainTitle');
            const subEl = document.getElementById('mainSubtitle');

            if(tabName === 'inicio') {
                titleEl.textContent = 'Artículos Cósmicos';
                subEl.textContent = 'Navega por las últimas novedades y descubrimientos astronómicos.';
                renderInicio();
            } else if(tabName === 'recursos') {
                titleEl.textContent = 'Recursos Educativos';
                subEl.textContent = 'Fichas pedagógicas organizadas para potenciar el aprendizaje.';
                populateTopicsRecursos();
                renderRecursos();
            } else if(tabName === 'videos') {
                titleEl.textContent = 'Videorecursos';
                subEl.textContent = 'Material audiovisual para explorar el universo de forma interactiva.';
                populateTopicsVideos();
                renderVideos();
            }
        }

        // Listener de buscadores para filtrar en tiempo real
        function setupListeners() {
            // Recursos
            document.getElementById('topicFilterRecursos').addEventListener('change', renderRecursos);
            document.getElementById('textSearchRecursos').addEventListener('input', renderRecursos);
            
            // Videos
            document.getElementById('topicFilterVideos').addEventListener('change', renderVideos);
            document.getElementById('textSearchVideos').addEventListener('input', renderVideos);
        }

        // ----------------- PESTAÑA INICIO (Artículos) -----------------
        function renderInicio() {
            const area = document.getElementById('contentArea');
            area.innerHTML = '';

            if(dataStore.inicio.length === 0) {
                area.innerHTML = '<div class="status-panel"><div class="status-icon">🕳️</div><div class="status-text">Cuadrante vacío: Sin artículos registrados.</div></div>';
                return;
            }

            dataStore.inicio.forEach((item, index) => {
                const titulo = item.Título || 'Artículo sin título';
                const imgUrl = item.foto || 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=800'; // Placeholder espacial
                const destacado = item.Destacado || item.resumen || 'Sin resumen previo.';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${imgUrl}" alt="${titulo}" class="card-img">
                        <div class="card-badge">Estelar</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${titulo}</h3>
                        <div class="card-desc">${destacado}</div>
                        <button class="card-btn" onclick="expandArticle(${index})">🪐 Ampliar</button>
                    </div>
                `;
                area.appendChild(card);
            });
        }

        function expandArticle(index) {
            const item = dataStore.inicio[index];
            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div class="detail-view">
                    <div class="detail-img-wrapper">
                        <img src="${item.foto}" alt="${item.Título}" class="detail-img">
                    </div>
                    <h2 class="detail-title">${item.Título}</h2>
                    <div class="detail-meta">
                        <span>🚀 Artículos Destacados</span>
                    </div>
                    <div class="detail-body">
                        ${item.resumen || item.Destacado || 'Texto completo no disponible.'}
                    </div>
                    <br>
                    ${item.enlace ? `<a href="${item.enlace.startsWith('http') ? item.enlace : 'https://'+item.enlace}" class="card-btn" style="max-width:250px;margin-bottom:25px;" target="_blank">🔗 Visitar enlace</a>` : ''}
                    <br>
                    <button class="back-btn" onclick="switchTab('inicio')">🔙 Volver al catálogo</button>
                </div>
            `;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // ----------------- PESTAÑA RECURSOS -----------------
        function populateTopicsRecursos() {
            const topics = new Set();
            dataStore.recursos.forEach(r => {
                if(r.categoría && r.categoría.trim() !== '') topics.add(r.categoría.trim());
            });
            const select = document.getElementById('topicFilterRecursos');
            select.innerHTML = '<option value="all">Todas las categorías (Tipos)</option>';
            [...topics].sort().forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                select.appendChild(opt);
            });
        }

        function renderRecursos() {
            const area = document.getElementById('contentArea');
            area.innerHTML = '';

            const selectedTopic = document.getElementById('topicFilterRecursos').value;
            const searchText = document.getElementById('textSearchRecursos').value.toLowerCase();

            const filtered = dataStore.recursos.filter(r => {
                const matchTopic = (selectedTopic === 'all' || (r.categoría && r.categoría.trim() === selectedTopic));
                const textTarget = (r.Descripción || '') + ' ' + (r.Name || '') + ' ' + (r.resumen || '');
                const matchText = !searchText || textTarget.toLowerCase().includes(searchText);
                return matchTopic && matchText;
            });

            if(filtered.length === 0) {
                area.innerHTML = '<div class="status-panel"><div class="status-icon">🛸</div><div class="status-text">No se hallaron recursos con los parámetros de búsqueda configurados.</div></div>';
                return;
            }

            filtered.forEach((r, idx) => {
                const name = r.Name || 'Recurso sin denominación';
                const cat = r.categoría || 'Recursos';
                const resumen = r.resumen || r.Descripción || 'Sin síntesis informativa.';
                const img = r.imagen || 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=800';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${img}" alt="${name}" class="card-img">
                        <div class="card-badge">${cat}</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${name}</h3>
                        <div class="card-desc">${resumen}</div>
                        <button class="card-btn" onclick="expandRecurso(${idx}, ${JSON.stringify(filtered).replace(/"/g, '&quot;')})">🛰️ Acceder a Ficha</button>
                    </div>
                `;
                area.appendChild(card);
            });
        }

        function expandRecurso(idx, list) {
            const r = list[idx];
            const area = document.getElementById('contentArea');
            const link = r.enlace ? (r.enlace.startsWith('http') ? r.enlace : 'https://'+r.enlace) : '#';
            const img = r.imagen || 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=800';

            area.innerHTML = `
                <div class="detail-view">
                    <div class="detail-img-wrapper">
                        <img src="${img}" alt="${r.Name}" class="detail-img">
                    </div>
                    <h2 class="detail-title">${r.Name}</h2>
                    <div class="detail-meta">
                        <span>📅 Publicado: ${r.FechaPublicado || 'N/D'}</span>
                        <span>🏷️ Categoría: ${r.categoría || 'General'}</span>
                    </div>
                    <div class="detail-body">
                        ${r.Descripción || r.resumen || 'Descripción ampliada vacía.'}
                    </div>
                    <br>
                    ${r.enlace ? `<a href="${link}" class="card-btn" style="max-width:280px;margin-bottom:25px;" target="_blank">🚀 Ir al recurso</a>` : ''}
                    <br>
                    <button class="back-btn" onclick="switchTab('recursos')">🔙 Volver al catálogo</button>
                </div>
            `;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // ----------------- PESTAÑA VIDEOS -----------------
        function populateTopicsVideos() {
            const topics = new Set();
            dataStore.videos.forEach(v => {
                if(v.Categoría && v.Categoría.trim() !== '') topics.add(v.Categoría.trim());
            });
            const select = document.getElementById('topicFilterVideos');
            select.innerHTML = '<option value="all">Todas las categorías (Temas)</option>';
            [...topics].sort().forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                select.appendChild(opt);
            });
        }

        function renderVideos() {
            const area = document.getElementById('contentArea');
            area.innerHTML = '';

            const selectedTopic = document.getElementById('topicFilterVideos').value;
            const searchText = document.getElementById('textSearchVideos').value.toLowerCase();

            const filtered = dataStore.videos.filter(v => {
                const matchTopic = (selectedTopic === 'all' || (v.Categoría && v.Categoría.trim() === selectedTopic));
                const textTarget = (v.Description || '') + ' ' + (v.Título || '') + ' ' + (v.resumen || '');
                const matchText = !searchText || textTarget.toLowerCase().includes(searchText);
                return matchTopic && matchText;
            });

            if(filtered.length === 0) {
                area.innerHTML = '<div class="status-panel"><div class="status-icon">🛸</div><div class="status-text">No se encontraron videorecursos con dichos parámetros estelares.</div></div>';
                return;
            }

            filtered.forEach((v, idx) => {
                const titulo = v.Título || 'Videorecurso sin título';
                const resumen = v.resumen || v.Description || 'Sin síntesis disponible.';
                const img = v.Image || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
                const cat = v.Categoría || 'Video';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${img}" alt="${titulo}" class="card-img">
                        <div class="card-badge">${cat}</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${titulo}</h3>
                        <div class="card-desc">${resumen}</div>
                        <button class="card-btn" onclick="expandVideo(${idx}, ${JSON.stringify(filtered).replace(/"/g, '&quot;')})">▶️ Reproducir</button>
                    </div>
                `;
                area.appendChild(card);
            });
        }

        function expandVideo(idx, list) {
            const v = list[idx];
            const area = document.getElementById('contentArea');
            
            // Extraer ID de video de Youtube en caso de que sea url larga, o usar embebido directo
            let videoSrc = v.enlace || '';
            if(videoSrc.includes('youtube.com/watch?v=')) {
                const videoId = videoSrc.split('v=')[1].split('&')[0];
                videoSrc = `https://www.youtube.com/embed/${videoId}`;
            } else if (videoSrc.includes('youtu.be/')) {
                const videoId = videoSrc.split('youtu.be/')[1].split('?')[0];
                videoSrc = `https://www.youtube.com/embed/${videoId}`;
            }

            area.innerHTML = `
                <div class="detail-view">
                    <h2 class="detail-title">${v.Título}</h2>
                    <div class="detail-meta">
                        <span>📅 Publicado: ${v['Date Published'] || v.DatePublished || 'N/D'}</span>
                        <span>📺 Canal: ${v.Canal || 'Desconocido'}</span>
                    </div>
                    
                    ${videoSrc ? `
                        <div class="video-container">
                            <iframe src="${videoSrc}" title="${v.Título}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    ` : `<div style="color:#ff3366;margin-bottom:20px;">⚠️ Señal débil: Video no disponible o formato de enlace no soportado.</div>`}
                    
                    <div class="detail-body" style="margin-top:20px;">
                        <strong>Descripción del videorecurso:</strong><br>
                        ${v.Description || v.resumen || 'Sin transcripción o descripción.'}
                    </div>
                    
                    <div style="margin-top:25px; color: var(--text-muted);">
                        🏷️ Categoría: <strong>${v.Categoría || 'General'}</strong> &nbsp;|&nbsp; ⏱️ Duración: <strong>${v.Duración || 'N/D'}</strong>
                    </div>
                    <br><br>
                    <button class="back-btn" onclick="switchTab('videos')">🔙 Volver al catálogo</button>
                </div>
            `;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Ejecutar carga de base de datos de Google Sheets de inmediato
        loadAllData();
    </script>
</body>
</html>

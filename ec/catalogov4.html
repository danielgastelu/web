<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Educativo - Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            /* Dark Theme Variables */
            --bg-color: #070913;
            --card-bg: #121830;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #00d9ff;
            --accent: #ffb700;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme='light'] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #0284c7;
            --accent: #f59e0b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: var(--text-main);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Standardized Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .img-container {
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: #eee;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 10px; }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex: 1; }
        
        .btn {
            display: block;
            text-align: center;
            padding: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* Grid */
        main { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }

        /* Error Panel */
        .error-panel { padding: 40px; text-align: center; border: 2px dashed #ff3366; border-radius: 20px; }
        
        /* Nav */
        nav { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .tab-btn { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: white; }
    </style>
</head>
<body data-theme="dark">

    <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>

    <nav>
        <button class="tab-btn active" onclick="showTab('inicio')">Inicio</button>
        <button class="tab-btn" onclick="showTab('recursos')">Recursos</button>
        <button class="tab-btn" onclick="showTab('videos')">Videos</button>
    </nav>

    <main id="app">
        <div id="grid" class="grid"></div>
    </main>

    <script>
        const sheetId = '1kreViUIlvUqtE76T48OoUXNrbE7QnsLwO2Tey676SK8';
        const endpoints = {
            inicio: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=INICIO`,
            recursos: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=RECURSOS`,
            videos: `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Videos`
        };

        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
        }

        async function fetchData(url, name) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP Error: ' + response.status);
                
                const text = await response.text();
                
                // Diagnostic check
                if (text.includes('<!DOCTYPE html>')) {
                    console.error(`Error de acceso en ${name}: El servidor devolvió una página HTML (Posible error de permisos).`);
                    return null;
                }
                
                return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
            } catch (e) {
                console.error('Fetch Error:', e);
                return null;
            }
        }

        async function init() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="error-panel">Cargando datos...</div>';
            
            const data = await fetchData(endpoints.recursos, 'Recursos');
            
            if (!data) {
                grid.innerHTML = `
                    <div class="error-panel">
                        <h2>Fallo en la sincronización</h2>
                        <p>No se pudo acceder a los datos. Esto ocurre frecuentemente por dos razones:</p>
                        <ul>
                            <li><strong>Permisos:</strong> La hoja NO está publicada correctamente.</li>
                            <li><strong>Acción:</strong> Ve a Archivo > Compartir > Publicar en la web.</li>
                        </ul>
                    </div>`;
                return;
            }
            
            // Render demo (Simplified for robustness test)
            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${item.imagen || 'https://via.placeholder.com/600x400'}" alt="img">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.Name || 'Sin título'}</h3>
                        <p class="card-desc">${item.resumen || 'Sin descripción'}</p>
                        <a href="#" class="btn">Ver más</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>

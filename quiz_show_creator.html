<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Show - Creador Dinámico</title>
    
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Utilizamos jsDelivr para máxima compatibilidad local en file://) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX autónomo -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.12/babel.min.js"></script>

    <!-- SheetJS para leer y exportar plantillas de Excel de manera robusta -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1120;
        }
        .star-bg {
            background-color: #0b1120;
            background-image:
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }
        .text-shadow-glow {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
        }
    </style>

    <!-- Sistema de Diagnóstico de Errores e Internet para el usuario -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorContainer = document.getElementById('loading-error');
            if (errorContainer) {
                errorContainer.innerHTML = `
                    <div class="p-6 bg-red-900/90 text-white rounded-2xl border-2 border-red-500 max-w-lg mx-auto my-10 shadow-2xl text-center">
                        <span class="text-4xl" aria-hidden="true">⚠️</span>
                        <h3 class="text-xl font-bold mt-3">Error en la aplicación</h3>
                        <p class="text-sm text-red-200 mt-2">${message}</p>
                        <p class="text-xs text-red-300/80 mt-4 font-mono">Línea: ${lineno}:${colno} - Archivo: ${source}</p>
                    </div>
                `;
                const spinner = document.getElementById('loading-spinner');
                if (spinner) spinner.style.display = 'none';
            }
            return false;
        };

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                if (!window.React || !window.ReactDOM || !window.Babel || !window.XLSX) {
                    const errorContainer = document.getElementById('loading-error');
                    const spinner = document.getElementById('loading-spinner');
                    if (spinner) spinner.style.display = 'none';
                    if (errorContainer) {
                        errorContainer.innerHTML = `
                            <div class="p-6 bg-slate-950/95 text-white rounded-2xl border-2 border-yellow-500 max-w-lg mx-auto my-10 shadow-2xl text-center">
                                <span class="text-5xl" aria-hidden="true">📡</span>
                                <h3 class="text-xl font-bold mt-4 text-yellow-400">Se requiere Conexión a Internet</h3>
                                <p class="text-sm text-slate-300 mt-2 leading-relaxed">
                                    Esta aplicación es un generador de trivias educativo interactivo. Para iniciarse, requiere conexión a Internet para descargar las librerías dinámicas de React y Excel de forma segura.
                                </p>
                                <p class="text-xs text-slate-400 mt-4 leading-relaxed bg-black/40 p-3 rounded-lg text-left font-mono">
                                    Recursos ausentes:<br>
                                    ${!window.React ? '• React.js (Interactividad principal)<br>' : ''}
                                    ${!window.ReactDOM ? '• React DOM (Renderizador de pantalla)<br>' : ''}
                                    ${!window.Babel ? '• Babel Compiler (Soporte de código)<br>' : ''}
                                    ${!window.XLSX ? '• SheetJS (Lector de archivos de Excel)<br>' : ''}
                                </p>
                                <button onclick="window.location.reload()" class="mt-6 px-6 py-2 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-black rounded-xl transition shadow-lg">
                                    🔄 Reintentar Cargar
                                </button>
                            </div>
                        `;
                    }
                }
            }, 3000);
        });
    </script>
</head>
<body>
    <div id="root">
        <!-- Pantalla de carga elegante inicial (desaparece inmediatamente cuando React se monta) -->
        <div id="loading-container" class="min-h-screen flex flex-col items-center justify-center text-white star-bg p-4">
            <div id="loading-spinner" class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-yellow-400 mb-4"></div>
                <h2 class="text-2xl font-extrabold text-yellow-400 text-shadow-glow tracking-widest">QUIZ SHOW</h2>
                <p class="text-sm text-blue-200 mt-2 opacity-85">Inicializando entorno interactivo...</p>
            </div>
            <div id="loading-error" class="w-full max-w-md mt-6"></div>
        </div>
    </div>

    <!-- El script tipo Babel ahora incluye data-presets para máxima compatibilidad móvil/desktop -->
    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useRef } = React;

        function App() {
          // Estados del menú y el juego
          const [gameState, setGameState] = useState('menu'); // 'menu' | 'playing'
          const [gameData, setGameData] = useState([]);
          const [finalJeopardy, setFinalJeopardy] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          
          // Estados de Configuración del Excel
          const [quizTitle, setQuizTitle] = useState('Quiz Show');
          const [quizSubtitle, setQuizSubtitle] = useState('La Trivia Competitiva');
          const [defaultTimer, setDefaultTimer] = useState(40);

          // Estados interactivos del juego
          const [answeredState, setAnsweredState] = useState({});
          const [activeQuestion, setActiveQuestion] = useState(null);
          const [showAnswer, setShowAnswer] = useState(false);
          const [timer, setTimer] = useState(40);
          const [scores, setScores] = useState({ equipo1: 0, equipo2: 0, equipo3: 0, equipo4: 0 });

          // Configuración interactiva de Equipos
          const [numTeams, setNumTeams] = useState(4); // Permite cambiar a 2, 3 o 4 equipos
          const [teamNames, setTeamNames] = useState({
            equipo1: 'Equipo 1',
            equipo2: 'Equipo 2',
            equipo3: 'Equipo 3',
            equipo4: 'Equipo 4'
          });

          // Estado para el modal de confirmación de salida personalizado
          const [showExitModal, setShowExitModal] = useState(false);

          // Sintetizador de audio nativo sin dependencias (Web Audio API)
          const playSound = (type) => {
            try {
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const oscillator = audioCtx.createOscillator();
              const gainNode = audioCtx.createGain();
              
              oscillator.connect(gainNode);
              gainNode.connect(audioCtx.destination);
              
              if (type === 'tick') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
                oscillator.stop(audioCtx.currentTime + 0.1);
              } else if (type === 'timeout') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(100, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.9);
                oscillator.stop(audioCtx.currentTime + 0.9);
              } else if (type === 'reveal') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Nota C5
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.25);
                
                setTimeout(() => {
                  const osc2 = audioCtx.createOscillator();
                  const gain2 = audioCtx.createGain();
                  osc2.connect(gain2);
                  gain2.connect(audioCtx.destination);
                  osc2.type = 'triangle';
                  osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // Nota E5
                  gain2.gain.setValueAtTime(0.08, audioCtx.currentTime);
                  osc2.start();
                  gain2.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.35);
                  osc2.stop(audioCtx.currentTime + 0.35);
                }, 120);
              }
            } catch (e) {
              console.log('AudioContext deshabilitado o bloqueado por el navegador.');
            }
          };

          // 1. Generar plantilla Excel de demostración lista para descargar
          const handleDownloadTemplate = () => {
              const templateData = [
                  { Categoria: "El Sol", Puntos: 100, Pregunta: "¿Qué tipo de astro es el Sol?", Respuesta: "Una estrella" },
                  { Categoria: "El Sol", Puntos: 200, Pregunta: "¿Gas más abundante en el Sol?", Respuesta: "Hidrógeno" },
                  { Categoria: "Planetas", Puntos: 100, Pregunta: "¿Planeta más cercano al Sol?", Respuesta: "Mercurio" },
                  { Categoria: "Planetas", Puntos: 200, Pregunta: "¿Planeta conocido como el planeta rojo?", Respuesta: "Marte" },
                  { Categoria: "Pregunta Final", Puntos: "Final", Pregunta: "¿Qué sondas llevan discos de oro con sonidos de la Tierra?", Respuesta: "Las sondas Voyager" }
              ];
              
              const configData = [
                  { Parametro: "Nombre del Quiz", Valor: "Quiz Show" },
                  { Parametro: "Subtitulo", Valor: "Sistema Solar - La Trivia" },
                  { Parametro: "Tiempo (segundos)", Valor: 40 }
              ];
              
              const wsJuego = XLSX.utils.json_to_sheet(templateData);
              const wsConfig = XLSX.utils.json_to_sheet(configData);
              
              wsConfig['!cols'] = [{ wch: 25 }, { wch: 30 }];

              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, wsJuego, "Juego");
              XLSX.utils.book_append_sheet(wb, wsConfig, "Configuracion");
              
              XLSX.writeFile(wb, "Plantilla_QuizShow.xlsx");
          };

          // Iniciar con datos de demostración sobre Astronomía (Acceso educativo inmediato)
          const handleLoadDemo = () => {
              setErrorMsg('');
              const demoQuestions = [
                  { Categoria: "El Sol", Puntos: 100, Pregunta: "¿Qué tipo de objeto celeste es el Sol?", Respuesta: "Una estrella enana amarilla" },
                  { Categoria: "El Sol", Puntos: 200, Pregunta: "¿Cuál es el gas más abundante en el Sol?", Respuesta: "Hidrógeno (aproximadamente 74%)" },
                  { Categoria: "El Sol", Puntos: 300, Pregunta: "¿Cuántos minutos tarda la luz solar en llegar a la Tierra?", Respuesta: "Aproximadamente 8 minutos y 20 segundos" },
                  
                  { Categoria: "Planetas", Puntos: 100, Pregunta: "¿Cuál es el planeta más grande de nuestro Sistema Solar?", Respuesta: "Júpiter" },
                  { Categoria: "Planetas", Puntos: 200, Pregunta: "¿Qué planeta tiene el conjunto de anillos más visible y espectacular?", Respuesta: "Saturno" },
                  { Categoria: "Planetas", Puntos: 300, Pregunta: "¿Cuál es el planeta más cálido del Sistema Solar debido a su denso efecto invernadero?", Respuesta: "Venus" },

                  { Categoria: "La Luna", Puntos: 100, Pregunta: "¿Cuántas fases principales tiene el ciclo lunar?", Respuesta: "4 fases principales (Nueva, Creciente, Llena y Menguante)" },
                  { Categoria: "La Luna", Puntos: 200, Pregunta: "¿Qué fuerza gravitatoria terrestre provoca la Luna principalmente en los océanos?", Respuesta: "Las mareas" },
                  { Categoria: "La Luna", Puntos: 300, Pregunta: "¿Cómo se llama el fenómeno cuando la Luna pasa directamente por la sombra de la Tierra?", Respuesta: "Eclipse lunar" },

                  { Categoria: "Cosmología", Puntos: 100, Pregunta: "¿En qué galaxia se encuentra nuestro Sistema Solar?", Respuesta: "La Vía Láctea" },
                  { Categoria: "Cosmología", Puntos: 200, Pregunta: "¿Cómo se llama la teoría científica más aceptada sobre el origen del universo?", Respuesta: "La teoría del Big Bang" },
                  { Categoria: "Cosmología", Puntos: 300, Pregunta: "¿Cuál es el exoplaneta rocoso más cercano descubierto a nuestro sistema?", Respuesta: "Próxima Centauri b" }
              ];

              const demoConfig = {
                  title: "Quiz de Astronomía",
                  subtitle: "Demostración Didáctica - Universo Interactivo",
                  timer: 30
              };

              processExcelData(demoQuestions, demoConfig);
          };

          // 2. Leer archivo subido por el usuario
          const handleFileUpload = (e) => {
              const file = e.target.files[0];
              if (!file) return;

              setErrorMsg('');
              const reader = new FileReader();
              
              reader.onload = (evt) => {
                  try {
                      const bstr = evt.target.result;
                      const wb = XLSX.read(bstr, { type: 'binary' });
                      
                      let config = { title: "Quiz Show", subtitle: "", timer: 40 };
                      
                      // Buscar hoja de configuración ignorando tildes y mayúsculas
                      const cleanSheetNames = wb.SheetNames.map(name => 
                          name.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                      );
                      
                      const configIdx = cleanSheetNames.indexOf("configuracion");
                      if (configIdx !== -1) {
                          const sheetName = wb.SheetNames[configIdx];
                          const wsConfig = wb.Sheets[sheetName];
                          const configData = XLSX.utils.sheet_to_json(wsConfig);
                          
                          configData.forEach(row => {
                              // Normalizar claves del registro
                              const cleanRow = {};
                              Object.keys(row).forEach(k => {
                                  cleanRow[String(k).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")] = row[k];
                              });
                              
                              const param = String(cleanRow["parametro"] || "").toLowerCase();
                              if (param.includes("nombre")) config.title = cleanRow["valor"];
                              if (param.includes("subtitulo")) config.subtitle = cleanRow["valor"];
                              if (param.includes("tiempo") || param.includes("segundo")) config.timer = parseInt(cleanRow["valor"]) || 40;
                          });
                      }

                      const juegoIdx = cleanSheetNames.indexOf("juego");
                      const wsJuegoName = juegoIdx !== -1 ? wb.SheetNames[juegoIdx] : wb.SheetNames[0];
                      const wsJuego = wb.Sheets[wsJuegoName];
                      const data = XLSX.utils.sheet_to_json(wsJuego);
                      
                      processExcelData(data, config);
                  } catch (err) {
                      setErrorMsg("Error al leer el archivo. Asegúrate de subir un archivo Excel (.xlsx o .xls) válido.");
                  }
              };
              reader.readAsBinaryString(file);
          };

          // 3. Procesar los datos cargados desde el JSON de Excel de forma tolerante a fallos
          const processExcelData = (jsonData, config) => {
              let categoriesMap = {};
              let finalQ = null;

              jsonData.forEach(row => {
                  // Normalizar todos los nombres de columnas de forma tolerante a tildes y mayúsculas
                  const normalizedRow = {};
                  Object.keys(row).forEach(key => {
                      const cleanKey = String(key)
                          .trim()
                          .toLowerCase()
                          .normalize("NFD")
                          .replace(/[\u0300-\u036f]/g, "");
                      normalizedRow[cleanKey] = row[key];
                  });

                  const cat = normalizedRow["categoria"];
                  const pts = normalizedRow["puntos"];
                  const q = normalizedRow["pregunta"];
                  const a = normalizedRow["respuesta"];

                  if (!cat || !pts || !q || !a) return; 

                  const cleanPts = String(pts).trim().toLowerCase();
                  if (cleanPts === 'final' || cleanPts === 'pregunta final' || cleanPts.includes('final')) {
                      finalQ = { category: String(cat).trim(), q: String(q).trim(), a: String(a).trim() };
                  } else {
                      // Extraer sólo dígitos (ej: "100 pts" -> 100, "$200" -> 200)
                      const digitMatch = cleanPts.match(/\d+/);
                      if (!digitMatch) return; 
                      const parsedPts = parseInt(digitMatch[0], 10);
                      
                      const catStr = String(cat).trim();
                      if (!categoriesMap[catStr]) {
                          categoriesMap[catStr] = [];
                      }
                      categoriesMap[catStr].push({ 
                          points: parsedPts, 
                          q: String(q).trim(), 
                          a: String(a).trim() 
                      });
                  }
              });

              // Ordenar las preguntas por puntaje de forma ascendente
              const finalGameData = Object.keys(categoriesMap).map(catName => ({
                  category: catName,
                  questions: categoriesMap[catName].sort((a, b) => a.points - b.points)
              }));

              if (finalGameData.length === 0) {
                  setErrorMsg("No se encontraron preguntas válidas. Verifica que tu hoja Excel tenga las columnas: 'Categoria', 'Puntos', 'Pregunta' y 'Respuesta'.");
                  return;
              }

              setQuizTitle(config.title || "Quiz Show");
              setQuizSubtitle(config.subtitle || "");
              setDefaultTimer(config.timer || 40);

              setGameData(finalGameData);
              setFinalJeopardy(finalQ || { category: "Pregunta Final", q: "¿Qué sonda espacial transporta el Disco de Oro con sonidos de la Tierra?", a: "Sonda Voyager" });
              setGameState('playing');
              setAnsweredState({});
              setScores({ equipo1: 0, equipo2: 0, equipo3: 0, equipo4: 0 });
          };

          // Gestión de temporizador interactivo con sonido
          useEffect(() => {
            let interval = null;
            if (activeQuestion && !showAnswer) {
              interval = setInterval(() => setTimer((prev) => {
                if (prev <= 1) {
                  clearInterval(interval);
                  playSound('timeout');
                  return 0;
                }
                if (prev <= 6) { // Sonar en los últimos 5 segundos de cuenta regresiva
                  playSound('tick');
                }
                return prev - 1;
              }), 1000);
            }
            return () => { if (interval) clearInterval(interval); };
          }, [activeQuestion, showAnswer]);

          const handleQuestionClick = (catIndex, qIndex) => {
            const key = `${catIndex}-${qIndex}`;
            if (answeredState[key]) return; 

            setActiveQuestion({
              ...gameData[catIndex].questions[qIndex],
              catName: gameData[catIndex].category,
              key
            });
            setTimer(defaultTimer);
            setShowAnswer(false);
          };

          const handleFinalJeopardyClick = () => {
            if (answeredState['final']) return;
            setActiveQuestion({
              ...finalJeopardy,
              catName: "⭐ PREGUNTA FINAL ⭐",
              key: 'final'
            });
            setTimer(defaultTimer);
            setShowAnswer(false);
          };

          const closeQuestion = () => {
            setAnsweredState(prev => ({ ...prev, [activeQuestion.key]: true }));
            setActiveQuestion(null);
          };

          const adjustScore = (team, amount) => {
            setScores(prev => ({ ...prev, [team]: prev[team] + amount }));
          };

          const triggerExitRequest = () => {
              setShowExitModal(true);
          };

          const confirmExitAndReset = () => {
              setShowExitModal(false);
              setGameState('menu');
          };

          // --- Pantalla 1: MENÚ DE CONFIGURACIÓN Y CARGA ---
          if (gameState === 'menu') {
              return (
                  <div className="min-h-screen font-sans text-white star-bg flex flex-col justify-between p-4 select-none">
                      <div className="flex-grow flex items-center justify-center py-6">
                          <div className="max-w-2xl w-full bg-blue-950/85 backdrop-blur-md p-6 md:p-10 rounded-3xl border-4 border-blue-800 shadow-2xl text-center">
                              <h1 className="text-4xl md:text-6xl font-extrabold uppercase tracking-widest text-yellow-400 text-shadow-glow mb-2">
                                  Quiz Show
                              </h1>
                              <h2 className="text-lg md:text-xl text-blue-200 mb-8 font-light">
                                  Creador de Trivias Dinámicas estilo Jeopardy
                              </h2>
                              
                              <div className="space-y-6">
                                  {/* Opción didáctica rápida: Astronomía integrada */}
                                  <div className="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 p-5 rounded-2xl border border-sky-500/30">
                                      <h3 className="text-base md:text-lg font-bold mb-1 text-sky-300">¿Deseas probar la aplicación ahora?</h3>
                                      <p className="text-xs text-slate-300 mb-3">Juega inmediatamente con un cuestionario educativo precargado de Astronomía.</p>
                                      <button 
                                          onClick={handleLoadDemo}
                                          className="px-6 py-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-sm rounded-xl shadow-lg transition-all hover:scale-105 active:scale-95"
                                      >
                                          ✨ Iniciar Trivia de Astronomía (Demo)
                                      </button>
                                  </div>

                                  {/* Paso 1: Descargar Plantilla */}
                                  <div className="bg-blue-900/50 p-5 rounded-xl border border-blue-700">
                                      <h3 className="text-base md:text-lg font-bold mb-1">1. Descarga la plantilla estructurada</h3>
                                      <p className="text-blue-300 text-xs mb-3">Revisa las pestañas <b>"Configuracion"</b> para ajustar el tiempo y nombre de la sesión, y la pestaña <b>"Juego"</b> para tus preguntas.</p>
                                      <button 
                                          onClick={handleDownloadTemplate}
                                          className="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-600 font-bold rounded-lg text-sm shadow-md transition-colors flex items-center justify-center mx-auto gap-2"
                                      >
                                          📄 Descargar Plantilla en Excel (.xlsx)
                                      </button>
                                  </div>

                                  {/* Paso 2: Subir archivo */}
                                  <div className="bg-blue-900/50 p-5 rounded-xl border border-blue-700">
                                      <h3 className="text-base md:text-lg font-bold mb-1">2. Carga tu propia Trivia</h3>
                                      <p className="text-blue-300 text-xs mb-3">Sube el archivo Excel que personalizaste para desplegar el panel de juego automáticamente.</p>
                                      
                                      <label className="cursor-pointer px-6 py-3 bg-gradient-to-r from-purple-700 to-blue-700 hover:from-purple-600 hover:to-blue-600 font-extrabold text-base rounded-full shadow-xl border-2 border-purple-400 transition-all hover:scale-105 inline-block">
                                          🚀 Cargar Excel y Jugar
                                          <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="sr-only" />
                                      </label>
                                  </div>

                                  {errorMsg && (
                                      <div className="p-4 bg-red-900/80 text-red-200 rounded-lg text-xs font-bold border border-red-500">
                                          ⚠️ {errorMsg}
                                      </div>
                                  )}
                              </div>
                          </div>
                      </div>
                      
                      {/* Pie de página oficial */}
                      <footer className="mt-4 mb-2 w-full flex justify-center">
                          <a 
                            href="https://uruguayeduca.anep.edu.uy/" 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-4xl px-4 py-3 bg-slate-950/40 rounded-2xl border border-blue-900/30 backdrop-blur-sm group hover:border-yellow-500/30 transition-all"
                          >
                            <img 
                              src="https://danielgastelu.github.io/web/logos/logoueblanco-removebg.png" 
                              alt="Logo Uruguay Educa" 
                              className="h-10 md:h-12 w-auto object-contain opacity-80 group-hover:opacity-100 transition-opacity"
                              onError={(e) => { e.currentTarget.style.display = 'none'; }}
                            />
                            <span className="text-xs text-blue-300/60 group-hover:text-yellow-400 text-center sm:text-left transition-colors tracking-wide leading-relaxed">
                              Portal Uruguay Educa (ANEP-DGES) - Contenidistas de Astronomía 2026 - Herramienta interactiva de uso libre - Preguntas y respuestas bajo responsabilidad del docente aplicador
                            </span>
                          </a>
                      </footer>
                  </div>
              );
          }

          // --- Pantalla 2: EL JUEGO (Tablero principal) ---
          const teamKeys = ['equipo1', 'equipo2', 'equipo3', 'equipo4'];
          const maxQuestions = gameData.length > 0 ? Math.max(...gameData.map(cat => cat.questions.length)) : 0;

          return (
            <div className="min-h-screen font-sans text-white star-bg flex flex-col items-center p-4 select-none">
              
              {/* Encabezado del Tablero */}
              <header className="text-center my-4 relative w-full px-4">
                <button 
                    onClick={triggerExitRequest}
                    className="absolute left-4 top-1/2 -translate-y-1/2 px-4 py-1.5 bg-red-900 hover:bg-red-800 text-white text-xs font-bold rounded-lg border border-red-700 transition shadow-md"
                >
                    Salir
                </button>
                <h1 className="text-3xl md:text-5xl font-extrabold uppercase tracking-widest text-yellow-400 text-shadow-glow mb-1">
                  {quizTitle}
                </h1>
                {quizSubtitle && (
                    <h2 className="text-base md:text-xl text-blue-200 font-light">
                        {quizSubtitle}
                    </h2>
                )}
              </header>

              {/* Tablero Principal de Categorías y Puntajes */}
              <main className="w-full max-w-[95%] mx-auto flex-grow flex flex-col justify-center">
                <div 
                    className="grid gap-2 bg-blue-950 p-2 rounded-xl border-4 border-blue-800 shadow-2xl"
                    style={{ gridTemplateColumns: `repeat(${gameData.length || 1}, minmax(0, 1fr))` }}
                >
                  {/* Títulos de Categoría Resilientes */}
                  {gameData.map((cat, i) => (
                    <div 
                      key={i} 
                      className="min-h-[3rem] md:min-h-[4rem] bg-blue-900 text-white font-bold text-center p-1 md:p-3 text-[10px] sm:text-xs md:text-sm lg:text-base uppercase flex items-center justify-center rounded border-2 border-blue-700 shadow-inner break-words leading-tight"
                    >
                      {cat.category}
                    </div>
                  ))}
                  
                  {/* Cuadrícula de Preguntas */}
                  {Array.from({ length: maxQuestions }).map((_, rowIndex) => (
                    <React.Fragment key={rowIndex}>
                      {gameData.map((cat, catIndex) => {
                        const q = cat.questions[rowIndex];
                        const key = `${catIndex}-${rowIndex}`;
                        const isAnswered = answeredState[key];

                        if (!q) return <div key={key} className="h-12 sm:h-16 md:h-20 lg:h-24"></div>; // Celda vacía para balancear las columnas de diferente altura

                        return (
                          <button
                            key={key}
                            onClick={() => handleQuestionClick(catIndex, rowIndex)}
                            disabled={isAnswered}
                            className={`
                              h-12 sm:h-16 md:h-20 lg:h-24 flex items-center justify-center text-lg sm:text-2xl md:text-3xl lg:text-4xl font-extrabold rounded
                              transition-all duration-300 border-2
                              ${isAnswered 
                                ? 'opacity-0 cursor-default pointer-events-none' 
                                : 'bg-blue-800 text-yellow-400 cursor-pointer hover:bg-blue-600 hover:scale-[1.02] border-blue-500 shadow-md text-shadow-glow active:scale-95'}
                            `}
                          >
                            {!isAnswered && q.points}
                          </button>
                        );
                      })}
                    </React.Fragment>
                  ))}
                </div>

                {/* Sección de Control de Equipos y Pregunta Final */}
                <div className="mt-6 flex flex-col items-center bg-black/50 p-4 rounded-2xl border border-blue-800/50 backdrop-blur-sm gap-6">
                  
                  {/* Pregunta Final Activadora */}
                  <button 
                    onClick={handleFinalJeopardyClick}
                    disabled={answeredState['final']}
                    className={`px-8 py-3 bg-gradient-to-r text-white font-black text-lg md:text-xl rounded-full shadow-lg border-2 transition-all ${
                      answeredState['final']
                        ? 'from-gray-800 to-slate-800 border-gray-600 opacity-50 cursor-not-allowed text-gray-400'
                        : 'from-purple-800 to-indigo-800 hover:from-purple-700 hover:to-indigo-700 border-purple-500 hover:scale-105 active:scale-95'
                    }`}
                  >
                    {answeredState['final'] ? '✅ PREGUNTA FINAL COMPLETADA' : '⭐ PREGUNTA FINAL ⭐'}
                  </button>

                  {/* Configuración en Caliente de Cantidad de Equipos */}
                  <div className="flex flex-col sm:flex-row justify-between items-center w-full max-w-5xl px-2 gap-4 border-t border-slate-800/80 pt-4">
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold text-blue-300">Marcadores</span>
                      <div className="flex items-center bg-blue-950/80 rounded-lg p-1 border border-blue-800">
                        <span className="text-[10px] text-blue-400 px-2 uppercase tracking-wider">Ver Equipos:</span>
                        {[2, 3, 4].map(n => (
                          <button
                            key={n}
                            onClick={() => setNumTeams(n)}
                            className={`px-2.5 py-1 text-xs font-bold rounded transition-all ${
                              numTeams === n 
                                ? 'bg-yellow-500 text-slate-950' 
                                : 'text-blue-300 hover:bg-blue-900'
                            }`}
                          >
                            {n}
                          </button>
                        ))}
                      </div>
                    </div>
                    
                    <button 
                      onClick={() => setScores({ equipo1: 0, equipo2: 0, equipo3: 0, equipo4: 0 })}
                      className="px-3 py-1.5 bg-slate-800/90 hover:bg-red-950 text-slate-300 hover:text-red-200 text-xs font-semibold rounded-lg border border-slate-700 hover:border-red-850 transition-all"
                      title="Reiniciar marcadores a cero"
                    >
                      🔄 Reiniciar Puntos
                    </button>
                  </div>

                  {/* Panel de Puntuaciones */}
                  <div className={`grid gap-4 w-full max-w-5xl ${
                    numTeams === 2 ? 'grid-cols-2' : numTeams === 3 ? 'grid-cols-3' : 'grid-cols-4'
                  }`}>
                    {teamKeys.slice(0, numTeams).map((team, index) => (
                      <div key={team} className="flex flex-col items-center bg-blue-900/60 p-3 rounded-xl border border-blue-700/60 shadow-inner group relative">
                        {/* El nombre del equipo es modificable directamente */}
                        <input 
                          type="text" 
                          value={teamNames[team]}
                          onChange={(e) => setTeamNames(prev => ({ ...prev, [team]: e.target.value }))}
                          className="text-center font-bold uppercase text-blue-200 bg-transparent hover:bg-blue-800/50 focus:bg-blue-950 focus:ring-1 focus:ring-yellow-400 rounded px-1 py-0.5 text-xs md:text-sm w-full border border-transparent focus:border-blue-500 transition-all outline-none"
                          title="Haz clic para personalizar el nombre"
                        />
                        <div className="text-2xl md:text-4xl font-mono text-yellow-400 my-1 font-bold">
                          {scores[team]}
                        </div>
                        <div className="flex gap-2">
                          <button 
                            onClick={() => adjustScore(team, 100)} 
                            className="w-8 h-8 bg-green-700 hover:bg-green-600 rounded text-lg font-bold flex items-center justify-center shadow transition-transform active:scale-90"
                            title="Sumar 100"
                          >
                            +
                          </button>
                          <button 
                            onClick={() => adjustScore(team, -100)} 
                            className="w-8 h-8 bg-red-800 hover:bg-red-700 rounded text-lg font-bold flex items-center justify-center shadow transition-transform active:scale-90"
                            title="Restar 100"
                          >
                            -
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </main>

              {/* Pie de página tablero */}
              <footer className="mt-8 mb-4 w-full flex justify-center">
                  <a 
                    href="https://uruguayeduca.anep.edu.uy/" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-4xl px-4 py-3 bg-slate-950/40 rounded-2xl border border-blue-900/30 backdrop-blur-sm group hover:border-yellow-500/30 transition-all"
                  >
                    <img 
                      src="https://danielgastelu.github.io/web/logos/logoueblanco-removebg.png" 
                      alt="Logo Uruguay Educa" 
                      className="h-10 md:h-12 w-auto object-contain opacity-80 group-hover:opacity-100 transition-opacity"
                      onError={(e) => { e.currentTarget.style.display = 'none'; }}
                    />
                    <span className="text-xs text-blue-300/60 group-hover:text-yellow-400 text-center sm:text-left transition-colors tracking-wide leading-relaxed">
                      Portal Uruguay Educa (ANEP) - Contenidistas de Astronomía 2026 - Herramienta interactiva de uso libre
                    </span>
                  </a>
              </footer>

              {/* MODAL DE CONFIRMACIÓN DE SALIDA SEGURO */}
              {showExitModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                  <div className="bg-slate-900 border-2 border-red-500 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl">
                    <span className="text-4xl" aria-hidden="true">⚠️</span>
                    <h3 className="text-xl font-bold text-white mt-3">¿Deseas salir del juego?</h3>
                    <p className="text-sm text-slate-300 mt-2">
                      Si sales del juego actual, perderás todos los puntajes y respuestas del tablero actual.
                    </p>
                    <div className="mt-6 flex gap-3 justify-center">
                      <button 
                        onClick={confirmExitAndReset}
                        className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-lg transition"
                      >
                        Sí, Salir
                      </button>
                      <button 
                        onClick={() => setShowExitModal(false)}
                        className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition"
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODAL PANTALLA COMPLETA DE PREGUNTA ACTIVA */}
              {activeQuestion && (
                <div className="fixed inset-0 z-50 star-bg flex flex-col justify-between bg-opacity-95 bg-[#0b1120] animate-fade-in">
                  
                  {/* Barra Superior */}
                  <div className="w-full flex justify-between items-center p-6 bg-blue-900/80 border-b border-blue-800 backdrop-blur-md">
                    <div className="text-xl md:text-3xl font-bold text-blue-200 uppercase tracking-wide">
                      {activeQuestion.catName}
                    </div>
                    {activeQuestion.points && activeQuestion.points !== 'Final' && (
                      <div className="text-3xl md:text-4xl font-extrabold text-yellow-400">
                        {activeQuestion.points} pts
                      </div>
                    )}
                  </div>

                  {/* Cuerpo Central del Desafío */}
                  <div className="flex-grow flex flex-col items-center justify-center p-4 md:p-8 max-w-6xl mx-auto w-full relative">
                    
                    {/* Visualizador de Cronómetro */}
                    <div className="absolute top-4 left-1/2 transform -translate-x-1/2 flex flex-col items-center">
                       <div className={`text-5xl md:text-8xl font-mono font-bold drop-shadow-xl transition-all duration-500 ${
                          timer === 0 ? 'text-red-500 scale-110 animate-pulse' : timer <= 10 ? 'text-orange-400' : 'text-yellow-400'
                       }`}>
                          {timer > 0 ? `00:${timer.toString().padStart(2, '0')}` : '¡Tiempo Agotado!'}
                       </div>
                    </div>

                    {/* Texto de la Pregunta */}
                    <div className="mt-20 w-full text-center">
                       <h2 className="text-3xl md:text-5xl lg:text-6xl font-extrabold text-white leading-snug drop-shadow-2xl px-4 md:px-12">
                         {activeQuestion.q}
                       </h2>
                    </div>

                    {/* Respuesta Correcta Revelada */}
                    <div className={`mt-8 w-full text-center transition-all duration-700 transform ${showAnswer ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8 pointer-events-none'}`}>
                       <p className="text-lg md:text-xl font-bold text-emerald-400 uppercase tracking-widest mb-2">Respuesta Correcta:</p>
                       <h3 className="text-2xl md:text-4xl lg:text-5xl font-bold text-white bg-emerald-950/80 inline-block px-6 md:px-8 py-3 md:py-4 rounded-2xl border-2 border-emerald-500/50 shadow-2xl backdrop-blur-sm leading-tight max-w-[90%]">
                         {activeQuestion.a}
                       </h3>

                       {/* Panel Inmediato de Adjudicación de Puntajes */}
                       <div className="mt-8 bg-slate-900/80 p-4 rounded-xl border border-blue-800/60 max-w-2xl mx-auto w-full">
                          <p className="text-xs font-bold text-blue-300 mb-3 uppercase tracking-widest">¿Quién respondió correctamente? Sumar puntos:</p>
                          <div className={`grid gap-2 ${numTeams === 2 ? 'grid-cols-2' : numTeams === 3 ? 'grid-cols-3' : 'grid-cols-4'}`}>
                             {teamKeys.slice(0, numTeams).map((team, index) => {
                               const ptsToAward = typeof activeQuestion.points === 'number' ? activeQuestion.points : 200;
                               return (
                                 <button
                                   key={team}
                                   onClick={() => {
                                     adjustScore(team, ptsToAward);
                                     playSound('reveal');
                                   }}
                                   className="px-2 py-2 bg-blue-900/60 hover:bg-emerald-600 text-xs font-extrabold rounded-lg transition-all border border-blue-700 hover:border-emerald-500 text-slate-100 shadow active:scale-95"
                                 >
                                   {teamNames[team]} (+{ptsToAward})
                                 </button>
                               );
                             })}
                          </div>
                       </div>
                    </div>
                  </div>

                  {/* Barra de Acciones Inferior */}
                  <div className="w-full bg-slate-900/95 p-6 flex flex-wrap justify-center gap-4 border-t-2 border-slate-700 backdrop-blur-md">
                    {!showAnswer ? (
                      <button 
                        onClick={() => {
                          setShowAnswer(true);
                          playSound('reveal');
                        }}
                        className="px-8 md:px-10 py-4 bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold text-lg md:text-xl rounded-xl shadow-xl transition-all hover:scale-105 active:scale-95"
                      >
                        👀 Mostrar Respuesta
                      </button>
                    ) : (
                      <button 
                        onClick={closeQuestion}
                        className="px-8 md:px-10 py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-lg md:text-xl rounded-xl shadow-xl transition-all hover:scale-105 active:scale-95"
                      >
                        🔙 Volver al Tablero
                      </button>
                    )}
                    {!showAnswer && (
                      <button 
                        onClick={closeQuestion}
                        className="px-6 py-4 bg-red-900/80 hover:bg-red-800 text-red-200 font-bold text-sm rounded-xl transition-colors"
                      >
                        Saltar Pregunta
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Montado robusto de React en el DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

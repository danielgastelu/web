<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL DE ACTIVIDADES</title>
    
    <style>
        :root {
            --bg-color: #f0f8ff;
            --header-bg: #4a90e2;
            --text-color: #333333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Verdana', 'Tahoma', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        #links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .activity-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .activity-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        .color-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌟 Portal de Actividades 🌟</h1>
        <p class="subtitle">Selecciona un juego para comenzar a aprender y divertirte</p>
    </header>

    <main>
        <div id="links-grid">
            <!-- Las tarjetas se generan dinámicamente mediante JavaScript -->
        </div>
    </main>

    <script>
        const activities = [
            { filename: 'burbujas.html', title: '¡EXPLOTA LAS BURBUJAS!', emoji: '🫧' },
            { filename: 'buscar_objetos_timer.html', title: '¡BÚSCALOS TODOS!', emoji: '⭐' },
            { filename: 'hanoi.html', title: 'TORRES DE HANÓI', emoji: '🗼' },
            { filename: 'listones_rojos.html', title: 'LISTONES ROJOS', emoji: '📏' },
            { filename: 'tabletas_color.html', title: 'TABLETAS DE COLOR', emoji: '🎨' },
            { filename: 'la_ruleta_de_colores.html', title: 'LA RULETA DE COLORES', emoji: '🎨' },
            { filename: 'alimentando_animales_montessori.html', title: 'ALIMENTANDO ANIMALITOS', emoji: '🐾' },
            { filename: 'apilador_de_colores.html', title: 'APILANDO BLOQUES', emoji: '📏' },
            { filename: 'apilador_de_colores_g.html', title: 'APILANDO BLOQUES PLUS', emoji: '📏' },
            { filename: 'a_ordenar_montessorib.html', title: '¡A ORDENAR JUGUETES!', emoji: '🧸' },
            { filename: 'guia_breve_montessori.html', title: 'Referencia breve de Diseño Montessori', emoji: '📖' },
        ];

        function renderActivities() {
            const gridEl = document.getElementById('links-grid');
            const cardColors = ['#ff9a9e', '#a1c4fd', '#d4fc79', '#f6d365', '#a8edea', '#fed6e3'];

            activities.forEach((act, index) => {
                const card = document.createElement('a');
                card.href = `./prim/${act.filename}`;
                card.className = 'activity-card';
                card.target = '_self';

                const color = cardColors[index % cardColors.length];

                card.innerHTML = `
                    <div class="color-bar" style="background-color: ${color}"></div>
                    <div class="icon">${act.emoji}</div>
                    <div class="title">${act.title}</div>
                `;

                gridEl.appendChild(card);
            });
        }

        // Iniciar renderizado al cargar la página
        window.onload = renderActivities;
    </script>
</body>
</html>

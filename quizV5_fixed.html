<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Show - Creador Dinámico</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS para leer y exportar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1120;
        }
        .star-bg {
            background-color: #0b1120;
            background-image:
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 4px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }
        .text-shadow-glow {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
          // Estados del menú y el juego
          const [gameState, setGameState] = useState('menu'); // 'menu' | 'playing'
          const [gameData, setGameData] = useState([]);
          const [finalJeopardy, setFinalJeopardy] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          
          // Estados de Configuración del Excel
          const [quizTitle, setQuizTitle] = useState('Quiz Show');
          const [quizSubtitle, setQuizSubtitle] = useState('La Trivia Competitiva');
          const [defaultTimer, setDefaultTimer] = useState(40);

          // Estados interactivos del juego
          const [answeredState, setAnsweredState] = useState({});
          const [activeQuestion, setActiveQuestion] = useState(null);
          const [showAnswer, setShowAnswer] = useState(false);
          const [timer, setTimer] = useState(40);
          const [scores, setScores] = useState({ equipo1: 0, equipo2: 0, equipo3: 0, equipo4: 0 });

          // Estado para el modal de confirmación de salida personalizado (reemplazo de confirm)
          const [showExitModal, setShowExitModal] = useState(false);

          // 1. Generar plantilla Excel para que el usuario la llene
          const handleDownloadTemplate = () => {
              const templateData = [
                  { Categoria: "El Sol", Puntos: 100, Pregunta: "¿Qué tipo de astro es el Sol?", Respuesta: "Una estrella" },
                  { Categoria: "El Sol", Puntos: 200, Pregunta: "¿Gas más abundante en el Sol?", Respuesta: "Hidrógeno" },
                  { Categoria: "Planetas", Puntos: 100, Pregunta: "¿Planeta más cercano al Sol?", Respuesta: "Mercurio" },
                  { Categoria: "Planetas", Puntos: 200, Pregunta: "¿Planeta conocido como el planeta rojo?", Respuesta: "Marte" },
                  { Categoria: "Pregunta Final", Puntos: "Final", Pregunta: "¿Qué sondas llevan discos de oro?", Respuesta: "Las sondas Voyager" }
              ];
              
              const configData = [
                  { Parametro: "Nombre del Quiz", Valor: "Quiz Show" },
                  { Parametro: "Subtitulo", Valor: "Sistema Solar - La Trivia" },
                  { Parametro: "Tiempo (segundos)", Valor: 40 }
              ];
              
              const wsJuego = XLSX.utils.json_to_sheet(templateData);
              const wsConfig = XLSX.utils.json_to_sheet(configData);
              
              wsConfig['!cols'] = [{ wch: 25 }, { wch: 30 }];

              const wb = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(wb, wsJuego, "Juego");
              XLSX.utils.book_append_sheet(wb, wsConfig, "Configuracion");
              
              XLSX.writeFile(wb, "Plantilla_QuizShow.xlsx");
          };

          // Iniciar con datos de demostración sobre Astronomía (Playability inmediata)
          const handleLoadDemo = () => {
              setErrorMsg('');
              const demoQuestions = [
                  { Categoria: "El Sol", Puntos: 100, Pregunta: "¿Qué tipo de objeto celeste es el Sol?", Respuesta: "Una estrella enana amarilla" },
                  { Categoria: "El Sol", Puntos: 200, Pregunta: "¿Cuál es el gas más abundante en el Sol?", Respuesta: "Hidrógeno (aproximadamente 74%)" },
                  { Categoria: "El Sol", Puntos: 300, Pregunta: "¿Cuántos minutos tarda la luz solar en llegar a la Tierra?", Respuesta: "Aproximadamente 8 minutos y 20 segundos" },
                  
                  { Categoria: "Planetas", Puntos: 100, Pregunta: "¿Cuál es el planeta más grande de nuestro Sistema Solar?", Respuesta: "Júpiter" },
                  { Categoria: "Planetas", Puntos: 200, Pregunta: "¿Qué planeta tiene el conjunto de anillos más visible y espectacular?", Respuesta: "Saturno" },
                  { Categoria: "Planetas", Puntos: 300, Pregunta: "¿Cuál es el planeta más cálido del Sistema Solar debido a su denso efecto invernadero?", Respuesta: "Venus" },

                  { Categoria: "La Luna", Puntos: 100, Pregunta: "¿Cuántas fases principales tiene el ciclo lunar?", Respuesta: "4 fases principales (Nueva, Creciente, Llena y Menguante)" },
                  { Categoria: "La Luna", Puntos: 200, Pregunta: "¿Qué fuerza gravitatoria terrestre provoca la Luna principalmente en los océanos?", Respuesta: "Las mareas" },
                  { Categoria: "La Luna", Puntos: 300, Pregunta: "¿Cómo se llama el fenómeno cuando la Luna pasa directamente por la sombra de la Tierra?", Respuesta: "Eclipse lunar" },

                  { Categoria: "Cosmología", Puntos: 100, Pregunta: "¿En qué galaxia se encuentra nuestro Sistema Solar?", Respuesta: "La Vía Láctea" },
                  { Categoria: "Cosmología", Puntos: 200, Pregunta: "¿Cómo se llama la teoría científica más aceptada sobre el origen del universo?", Respuesta: "La teoría del Big Bang" },
                  { Categoria: "Cosmología", Puntos: 300, Pregunta: "¿Cuál es el exoplaneta rocoso más cercano descubierto a nuestro sistema?", Respuesta: "Próxima Centauri b" }
              ];

              const demoConfig = {
                  title: "Quiz de Astronomía",
                  subtitle: "Demostración Didáctica - Universo Interactivo",
                  timer: 30
              };

              // Procesar directamente
              processExcelData(demoQuestions, demoConfig);
          };

          // 2. Leer archivo subido por el usuario
          const handleFileUpload = (e) => {
              const file = e.target.files[0];
              if (!file) return;

              setErrorMsg('');
              const reader = new FileReader();
              
              reader.onload = (evt) => {
                  try {
                      const bstr = evt.target.result;
                      const wb = XLSX.read(bstr, { type: 'binary' });
                      
                      let config = { title: "Quiz Show", subtitle: "", timer: 40 };
                      if (wb.SheetNames.includes("Configuracion") || wb.SheetNames.includes("Configuración")) {
                          const sheetName = wb.SheetNames.includes("Configuracion") ? "Configuracion" : "Configuración";
                          const wsConfig = wb.Sheets[sheetName];
                          const configData = XLSX.utils.sheet_to_json(wsConfig);
                          
                          configData.forEach(row => {
                              const param = String(row.Parametro || "").toLowerCase();
                              if (param.includes("nombre")) config.title = row.Valor;
                              if (param.includes("subtitulo") || param.includes("subtítulo")) config.subtitle = row.Valor;
                              if (param.includes("tiempo") || param.includes("segundo")) config.timer = parseInt(row.Valor) || 40;
                          });
                      }

                      const wsJuegoName = wb.SheetNames.includes("Juego") ? "Juego" : wb.SheetNames[0];
                      const wsJuego = wb.Sheets[wsJuegoName];
                      const data = XLSX.utils.sheet_to_json(wsJuego);
                      
                      processExcelData(data, config);
                  } catch (err) {
                      setErrorMsg("Error al leer el archivo. Asegúrate de que sea un archivo Excel (.xlsx) válido.");
                  }
              };
              reader.readAsBinaryString(file);
          };

          // 3. Procesar los datos en JSON y agruparlos para el juego
          const processExcelData = (jsonData, config) => {
              let categoriesMap = {};
              let finalQ = null;

              jsonData.forEach(row => {
                  const cat = row.Categoria || row.categoria || row.CATEGORIA;
                  const pts = row.Puntos || row.puntos || row.PUNTOS;
                  const q = row.Pregunta || row.pregunta || row.PREGUNTA;
                  const a = row.Respuesta || row.respuesta || row.RESPUESTA;

                  if (!cat || !pts || !q || !a) return; 

                  if (String(pts).trim().toLowerCase() === 'final') {
                      finalQ = { category: cat, q: q, a: a };
                  } else {
                      if (!categoriesMap[cat]) {
                          categoriesMap[cat] = [];
                      }
                      categoriesMap[cat].push({ points: parseInt(pts), q: q, a: a });
                  }
              });

              const finalGameData = Object.keys(categoriesMap).map(catName => ({
                  category: catName,
                  questions: categoriesMap[catName].sort((a, b) => a.points - b.points)
              }));

              if (finalGameData.length === 0) {
                  setErrorMsg("No se encontraron preguntas válidas. Verifica que las columnas se llamen: Categoria, Puntos, Pregunta, Respuesta.");
                  return;
              }

              setQuizTitle(config.title || "Quiz Show");
              setQuizSubtitle(config.subtitle || "");
              setDefaultTimer(config.timer || 40);

              setGameData(finalGameData);
              setFinalJeopardy(finalQ || { category: "Pregunta Final", q: "¿Qué sonda espacial transporta el Disco de Oro con sonidos de la Tierra?", a: "Sonda Voyager" });
              setGameState('playing');
              setAnsweredState({});
              setScores({ equipo1: 0, equipo2: 0, equipo3: 0, equipo4: 0 });
          };

          useEffect(() => {
            let interval = null;
            if (activeQuestion && !showAnswer) {
              interval = setInterval(() => setTimer((prev) => {
                if (prev <= 1) {
                  clearInterval(interval);
                  return 0;
                }
                return prev - 1;
              }), 1000);
            }
            return () => { if (interval) clearInterval(interval); };
          }, [activeQuestion, showAnswer]);

          const handleQuestionClick = (catIndex, qIndex) => {
            const key = `${catIndex}-${qIndex}`;
            if (answeredState[key]) return; 

            setActiveQuestion({
              ...gameData[catIndex].questions[qIndex],
              catName: gameData[catIndex].category,
              key
            });
            setTimer(defaultTimer);
            setShowAnswer(false);
          };

          const handleFinalJeopardyClick = () => {
            if (answeredState['final']) return;
            setActiveQuestion({
              ...finalJeopardy,
              catName: "⭐ PREGUNTA FINAL ⭐",
              key: 'final'
            });
            setTimer(defaultTimer);
            setShowAnswer(false);
          };

          const closeQuestion = () => {
            setAnsweredState(prev => ({ ...prev, [activeQuestion.key]: true }));
            setActiveQuestion(null);
          };

          const adjustScore = (team, amount) => {
            setScores(prev => ({ ...prev, [team]: prev[team] + amount }));
          };

          // Manejo de salida segura controlada (Reemplazo interactivo del confirm nativo)
          const triggerExitRequest = () => {
              setShowExitModal(true);
          };

          const confirmExitAndReset = () => {
              setShowExitModal(false);
              setGameState('menu');
          };

          // Pantalla 1: MENÚ DE CARGA
          if (gameState === 'menu') {
              return (
                  <div className="min-h-screen font-sans text-white star-bg flex flex-col justify-between p-4 select-none">
                      <div className="flex-grow flex items-center justify-center">
                          <div className="max-w-2xl w-full bg-blue-950/80 backdrop-blur-md p-8 md:p-12 rounded-3xl border-4 border-blue-800 shadow-2xl text-center">
                              <h1 className="text-5xl md:text-6xl font-extrabold uppercase tracking-widest text-yellow-400 text-shadow-glow mb-4">
                                  Quiz Show
                              </h1>
                              <h2 className="text-xl md:text-2xl text-blue-200 mb-8 font-light">
                                  Creador Dinámico con Excel
                              </h2>
                              
                              <div className="space-y-6">
                                  {/* Opción Rápida: Demo instantáneo */}
                                  <div className="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 p-5 rounded-2xl border border-sky-500/30">
                                      <h3 className="text-lg font-bold mb-1 text-sky-300">¿No tienes un Excel listo?</h3>
                                      <p className="text-xs text-slate-300 mb-3">Prueba y juega de inmediato con preguntas integradas de Astronomía.</p>
                                      <button 
                                          onClick={handleLoadDemo}
                                          className="px-6 py-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-sm rounded-xl shadow-lg transition-transform hover:scale-105"
                                      >
                                          ✨ Probar Demo de Astronomía
                                      </button>
                                  </div>

                                  {/* Paso 1: Plantilla */}
                                  <div className="bg-blue-900/50 p-6 rounded-xl border border-blue-700">
                                      <h3 className="text-xl font-bold mb-2">1. Prepara tus preguntas</h3>
                                      <p className="text-blue-300 text-sm mb-4">Descarga la plantilla, revisa la pestaña <b>"Configuracion"</b> para ajustar el tiempo/nombre, y usa la pestaña <b>"Juego"</b> para tus preguntas.</p>
                                      <button 
                                          onClick={handleDownloadTemplate}
                                          className="px-6 py-3 bg-green-700 hover:bg-green-600 font-bold rounded-lg shadow-lg transition-colors flex items-center justify-center mx-auto gap-2"
                                      >
                                          📄 Descargar Plantilla .xlsx
                                      </button>
                                  </div>

                                  {/* Paso 2: Subir */}
                                  <div className="bg-blue-900/50 p-6 rounded-xl border border-blue-700">
                                      <h3 className="text-xl font-bold mb-2">2. Cargar y Jugar</h3>
                                      <p className="text-blue-300 text-sm mb-4">Sube tu archivo Excel ya modificado para empezar a jugar automáticamente.</p>
                                      
                                      <label className="cursor-pointer px-8 py-4 bg-gradient-to-r from-purple-700 to-blue-700 hover:from-purple-600 hover:to-blue-600 font-extrabold text-xl rounded-full shadow-xl border-2 border-purple-400 transition-transform hover:scale-105 inline-block">
                                          🚀 Subir Excel y Jugar
                                          <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="sr-only" />
                                      </label>
                                  </div>

                                  {errorMsg && (
                                      <div className="p-4 bg-red-900/80 text-red-200 rounded-lg font-bold border border-red-500">
                                          ⚠️ {errorMsg}
                                      </div>
                                  )}
                              </div>
                          </div>
                      </div>
                      
                      {/* PIE DE PÁGINA (MENÚ CON LOGO) */}
                      <footer className="mt-8 mb-4 w-full flex justify-center">
                          <a 
                            href="https://uruguayeduca.anep.edu.uy/" 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-4xl px-4 py-3 bg-slate-950/40 rounded-2xl border border-blue-900/30 backdrop-blur-sm group hover:border-yellow-500/30 transition-all"
                          >
                            <img 
                              src="https://danielgastelu.github.io/web/logos/logoueblanco-removebg.png" 
                              alt="Logo Uruguay Educa" 
                              className="h-10 md:h-12 w-auto object-contain opacity-80 group-hover:opacity-100 transition-opacity"
                              onError={(e) => { e.currentTarget.style.display = 'none'; }}
                            />
                            <span className="text-xs md:text-sm text-blue-300/60 group-hover:text-yellow-400 text-center sm:text-left transition-colors tracking-wide leading-relaxed">
                              Portal Uruguay Educa (ANEP-DGES) - Contenidistas de Astronomía 2026 - Herramienta de uso libre - Desarrollado con asistencia de IA - Preguntas y respuestas responsabilidad de docente aplicador
                            </span>
                          </a>
                      </footer>
                  </div>
              );
          }

          // Pantalla 2: EL JUEGO (Tablero principal)
          const teamKeys = ['equipo1', 'equipo2', 'equipo3', 'equipo4'];
          
          // Determinar filas basándonos en la categoría con más preguntas con validador de seguridad
          const maxQuestions = gameData.length > 0 ? Math.max(...gameData.map(cat => cat.questions.length)) : 0;

          return (
            <div className="min-h-screen font-sans text-white star-bg flex flex-col items-center p-4 select-none">
              {/* HEADER */}
              <header className="text-center my-4 md:my-6 relative w-full">
                <button 
                    onClick={triggerExitRequest}
                    className="absolute left-0 top-0 mt-2 ml-4 px-4 py-2 bg-red-900 hover:bg-red-800 text-white font-bold rounded-lg text-sm"
                >
                    Salir
                </button>
                <h1 className="text-4xl md:text-5xl font-extrabold uppercase tracking-widest text-yellow-400 text-shadow-glow mb-2">
                  {quizTitle}
                </h1>
                {quizSubtitle && (
                    <h2 className="text-xl md:text-2xl text-blue-200 font-light">
                        {quizSubtitle}
                    </h2>
                )}
              </header>

              {/* GAME BOARD */}
              <main className="w-full max-w-[95%] mx-auto flex-grow flex flex-col">
                <div 
                    className="grid gap-2 bg-blue-950 p-2 rounded-xl border-4 border-blue-800 shadow-2xl"
                    style={{ gridTemplateColumns: `repeat(${gameData.length || 1}, minmax(0, 1fr))` }}
                >
                  {/* Categorías */}
                  {gameData.map((cat, i) => (
                    <div key={i} className="bg-blue-900 text-white font-bold text-center p-2 md:p-4 text-xs md:text-base uppercase flex items-center justify-center rounded border-2 border-blue-700 shadow-inner break-words">
                      {cat.category}
                    </div>
                  ))}
                  
                  {/* Preguntas (Generadas dinámicamente según maxQuestions) */}
                  {Array.from({ length: maxQuestions }).map((_, rowIndex) => (
                    <React.Fragment key={rowIndex}>
                      {gameData.map((cat, catIndex) => {
                        const q = cat.questions[rowIndex];
                        const key = `${catIndex}-${rowIndex}`;
                        const isAnswered = answeredState[key];

                        if (!q) return <div key={key} className="h-16 md:h-24"></div>; // Espacio vacío si una categoría tiene menos preguntas

                        return (
                          <div
                            key={key}
                            onClick={() => handleQuestionClick(catIndex, rowIndex)}
                            className={`
                              h-16 md:h-20 lg:h-24 flex items-center justify-center text-2xl md:text-4xl font-extrabold rounded
                              transition-all duration-300
                              ${isAnswered 
                                ? 'opacity-0 cursor-default pointer-events-none' 
                                : 'bg-blue-800 text-yellow-400 cursor-pointer hover:bg-blue-600 hover:scale-[1.02] border-2 border-blue-500 shadow-md text-shadow-glow'}
                            `}
                          >
                            {!isAnswered && q.points}
                          </div>
                        );
                      })}
                    </React.Fragment>
                  ))}
                </div>

                {/* BOTTOM CONTROLS (Scores & Final Question) */}
                <div className="mt-6 flex flex-col items-center bg-black/50 p-4 md:p-6 rounded-2xl border border-blue-800/50 backdrop-blur-sm gap-6">
                  
                  <button 
                    onClick={handleFinalJeopardyClick}
                    className="px-8 py-3 bg-gradient-to-r from-purple-800 to-indigo-800 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-xl rounded-full shadow-lg border-2 border-purple-500 transition-transform hover:scale-105"
                  >
                    ⭐ PREGUNTA FINAL ⭐
                  </button>

                  {/* Grid de Marcadores */}
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 w-full max-w-5xl">
                    {teamKeys.map((team, index) => (
                      <div key={team} className="flex flex-col items-center bg-blue-900/60 p-3 rounded-xl border border-blue-700/60 shadow-inner">
                        <div className="text-lg font-bold uppercase text-blue-200">Equipo {index + 1}</div>
                        <div className="text-3xl font-mono text-yellow-400 my-1">{scores[team]}</div>
                        <div className="flex gap-2">
                          <button onClick={() => adjustScore(team, 100)} className="w-10 h-10 bg-green-700 hover:bg-green-600 rounded text-xl font-bold flex items-center justify-center">+</button>
                          <button onClick={() => adjustScore(team, -100)} className="w-10 h-10 bg-red-800 hover:bg-red-700 rounded text-xl font-bold flex items-center justify-center">-</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </main>

              {/* PIE DE PÁGINA (TABLERO JUEGO CON LOGO) */}
              <footer className="mt-8 mb-4 w-full flex justify-center">
                  <a 
                    href="https://uruguayeduca.anep.edu.uy/" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-4xl px-4 py-3 bg-slate-950/40 rounded-2xl border border-blue-900/30 backdrop-blur-sm group hover:border-yellow-500/30 transition-all"
                  >
                    <img 
                      src="https://danielgastelu.github.io/web/logos/logoueblanco-removebg.png" 
                      alt="Logo Uruguay Educa" 
                      className="h-10 md:h-12 w-auto object-contain opacity-80 group-hover:opacity-100 transition-opacity"
                      onError={(e) => { e.currentTarget.style.display = 'none'; }}
                    />
                    <span className="text-xs md:text-sm text-blue-300/60 group-hover:text-yellow-400 text-center sm:text-left transition-colors tracking-wide leading-relaxed">
                      Portal Uruguay Educa (ANEP) - Contenidistas de Astronomía 2026 - Herramienta de uso libre
                    </span>
                  </a>
              </footer>

              {/* MODAL DE CONFIRMACIÓN DE SALIDA (Reemplazo accesible de confirm nativo) */}
              {showExitModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                  <div className="bg-slate-900 border-2 border-red-500 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl">
                    <span className="text-4xl" aria-hidden="true">⚠️</span>
                    <h3 className="text-xl font-bold text-white mt-3">¿Seguro que deseas salir?</h3>
                    <p className="text-sm text-slate-300 mt-2">
                      Si abandonas el juego actual, perderás todos los puntos acumulados por los equipos.
                    </p>
                    <div className="mt-6 flex gap-3 justify-center">
                      <button 
                        onClick={confirmExitAndReset}
                        className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-lg transition"
                      >
                        Sí, Salir
                      </button>
                      <button 
                        onClick={() => setShowExitModal(false)}
                        className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition"
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* QUESTION MODAL (Full Screen) */}
              {activeQuestion && (
                <div className="fixed inset-0 z-50 star-bg flex flex-col justify-between bg-opacity-95 bg-[#0b1120]">
                  
                  {/* Top Bar */}
                  <div className="w-full flex justify-between items-center p-6 bg-blue-900/80 border-b border-blue-800 backdrop-blur-md">
                    <div className="text-xl md:text-3xl font-bold text-blue-200 uppercase tracking-wide">
                      {activeQuestion.catName}
                    </div>
                    {activeQuestion.points && activeQuestion.points !== 'Final' && (
                      <div className="text-3xl md:text-4xl font-extrabold text-yellow-400">
                        {activeQuestion.points}
                      </div>
                    )}
                  </div>

                  {/* Center Content */}
                  <div className="flex-grow flex flex-col items-center justify-center p-4 md:p-8 max-w-6xl mx-auto w-full relative">
                    <div className="absolute top-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center">
                       <div className={`text-6xl md:text-8xl font-mono font-bold drop-shadow-xl transition-colors duration-500 ${
                          timer === 0 ? 'text-red-500 scale-110 animate-pulse' : timer <= 10 ? 'text-orange-400' : 'text-yellow-400'
                       }`}>
                          {timer > 0 ? `00:${timer.toString().padStart(2, '0')}` : '¡Time out!'}
                       </div>
                    </div>

                    <div className="mt-32 w-full text-center">
                       <h2 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white leading-snug drop-shadow-2xl px-4 md:px-12">
                         {activeQuestion.q}
                       </h2>
                    </div>

                    <div className={`mt-12 w-full text-center transition-all duration-700 transform ${showAnswer ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8 pointer-events-none'}`}>
                       <p className="text-xl md:text-2xl font-bold text-green-400 uppercase tracking-widest mb-2">Respuesta Correcta:</p>
                       <h3 className="text-3xl md:text-4xl lg:text-5xl font-bold text-white bg-green-900/60 inline-block px-8 py-4 rounded-2xl border-2 border-green-500/50 shadow-2xl backdrop-blur-sm">
                         {activeQuestion.a}
                       </h3>
                    </div>
                  </div>

                  {/* Bottom Bar */}
                  <div className="w-full bg-slate-900/90 p-6 flex flex-wrap justify-center gap-4 border-t-2 border-slate-700 backdrop-blur-md">
                    {!showAnswer ? (
                      <button 
                        onClick={() => setShowAnswer(true)}
                        className="px-8 md:px-10 py-4 bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold text-xl md:text-2xl rounded-xl shadow-xl transition-transform hover:scale-105"
                      >
                        👀 Mostrar Respuesta
                      </button>
                    ) : (
                      <button 
                        onClick={closeQuestion}
                        className="px-8 md:px-10 py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xl md:text-2xl rounded-xl shadow-xl transition-transform hover:scale-105"
                      >
                        🔙 Volver al Tablero
                      </button>
                    )}
                    {!showAnswer && (
                      <button 
                        onClick={closeQuestion}
                        className="px-6 py-4 bg-red-900 hover:bg-red-800 text-red-200 font-bold text-lg rounded-xl transition-colors"
                      >
                        Cancelar
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

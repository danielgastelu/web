<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Silábico: Vocabulario Científico y Escolar</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-color: #ffffff;
            --primary-color: #2a6f97;
            --accent-color: #014f86;
            --success-color: #2a9d8f;
            --error-color: #e76f51;
            --text-color: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat-card {
            background: var(--card-color);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-container {
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .word-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .hint {
            font-size: 0.95rem;
            color: #6c757d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            font-size: 1.3rem;
            padding: 12px;
            border: 2px solid #slate;
            border-radius: 8px;
            text-align: center;
            text-transform: lowercase;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            font-size: 1.2rem;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-color);
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }

        .correct { color: var(--success-color); }
        .incorrect { color: var(--error-color); }
    </style>
</head>
<body>

    <header>
        <h1>🔬 Laboratorio de Sílabas</h1>
        <p>Separa las palabras usando guiones (ejemplo: <strong>ci-en-cia</strong>)</p>
    </header>

    <div class="dashboard">
        <div class="stat-card">
            <span>🎯</span> Puntos: <span id="score">0</span>
        </div>
        <div class="stat-card">
            <span>🧩</span> Racha: <span id="streak">0</span>
        </div>
    </div>

    <div class="game-container">
        <div class="word-display" id="word-to-split">---</div>
        <div class="hint" id="word-definition">Cargando definición...</div>

        <div class="input-section">
            <input type="text" id="user-input" placeholder="tu-res-pues-ta" autocomplete="off">
            <button id="action-btn" onclick="checkAnswer()">Validar Respuesta</button>
        </div>

        <div class="feedback" id="feedback-message"></div>
    </div>

    <script>
        // Base de datos de palabras (Vocabulario STEAM / Escolar para 12-14 años)
        const vocabulary = [
            { word: "atmósfera", syllables: "at-mós-fe-ra", definition: "Capa de gas que rodea a un cuerpo celeste." },
            { word: "microscopio", syllables: "mi-cros-co-pio", definition: "Instrumento óptico para ampliar la imagen de objetos diminutos." },
            { word: "ecosistema", syllables: "e-co-sis-te-ma", definition: "Comunidad de seres vivos cuyos procesos vitales se relacionan entre sí." },
            { word: "algoritmo", syllables: "al-go-rit-mo", definition: "Conjunto ordenado de operaciones sistemáticas que permite hacer un cálculo." },
            { word: "parábola", syllables: "pa-rá-bo-la", definition: "Curva abierta simétrica respecto a un eje (matemáticas) o narración didáctica." },
            { word: "fotosíntesis", syllables: "fo-to-sín-te-sis", definition: "Proceso metabólico por el que las plantas verdes convierten materia inorgánica en orgánica." },
            { word: "gravedad", syllables: "gra-ve-dad", definition: "Fuerza de atracción mutua entre masas de materia." },
            { word: "espectro", syllables: "es-pec-tro", definition: "Distribución de la intensidad de una radiación en función de una magnitud física." },
            { word: "biodiversidad", syllables: "bio-di-ver-si-dad", definition: "Variedad de especies vegetales y animales en su medio ambiente." },
            { word: "geometría", syllables: "ge-o-me-trí-a", definition: "Rama de las matemáticas que estudia las propiedades de las figuras en el plano o espacio." }
        ];

        let currentWordIndex = 0;
        let score = 0;
        let streak = 0;
        let isNextMode = false;

        const wordDisplay = document.getElementById("word-to-split");
        const hintDisplay = document.getElementById("word-definition");
        const userInput = document.getElementById("user-input");
        const actionBtn = document.getElementById("action-btn");
        const feedbackMessage = document.getElementById("feedback-message");
        const scoreDisplay = document.getElementById("score");
        const streakDisplay = document.getElementById("streak");

        function loadWord() {
            // Mezclar índice si se quiere aleatorio, aquí va secuencial para control
            const currentData = vocabulary[currentWordIndex];
            wordDisplay.textContent = currentData.word;
            hintDisplay.textContent = `Definición: ${currentData.definition}`;
            userInput.value = "";
            feedbackMessage.textContent = "";
            feedbackMessage.className = "feedback";
            actionBtn.textContent = "Validar Respuesta";
            isNextMode = false;
            userInput.disabled = false;
            userInput.focus();
        }

        function checkAnswer() {
            if (isNextMode) {
                nextWord();
                return;
            }

            const currentData = vocabulary[currentWordIndex];
            // Sanitización básica: quitar espacios en blanco extremos y convertir a minúsculas
            const processedInput = userInput.value.trim().toLowerCase();
            const correctAnswer = currentData.syllables.toLowerCase();

            if (processedInput === correctAnswer) {
                score += 10;
                streak += 1;
                feedbackMessage.textContent = "✅ ¡Excelente! División silábica correcta.";
                feedbackMessage.className = "feedback correct";
                updateSystemLogic(true);
            } else {
                streak = 0;
                feedbackMessage.textContent = `❌ Incorrecto. La separación es: ${currentData.syllables}`;
                feedbackMessage.className = "feedback incorrect";
                updateSystemLogic(false);
            }

            scoreDisplay.textContent = score;
            streakDisplay.textContent = streak;
            
            actionBtn.textContent = "Siguiente Palabra";
            isNextMode = true;
            userInput.disabled = true;
        }

        function updateSystemLogic(isCorrect) {
            // Aquí se pueden añadir hooks de depuración o lógica algorítmica adicional
        }

        function nextWord() {
            currentWordIndex = (currentWordIndex + 1) % vocabulary.length;
            loadWord();
        }

        // Permitir validar presionando la tecla "Enter"
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        // Inicializar el primer desafío al cargar la página
        window.onload = loadWord;
    </script>
</body>
</html>

      <section class="band on-ink" aria-labelledby="mist-h">

          <p data-i18n="mist_desc"></p>

            <div class="clue"><h3 data-i18n="q1_title"></h3><p data-i18n="q1_desc"></p></div>
            <div class="clue"><h3 data-i18n="q2_title"></h3><p data-i18n="q2_desc"></p></div>
            <div class="clue"><h3 data-i18n="q3_title"></h3><p data-i18n="q3_desc"></p></div>
          </div>
          <p class="quote" data-i18n="mist_quote"></p>
          <div class="cta-row"><a class="btn btn-primary" href="#/observar" data-i18n="how_cta"></a></div>
        </div>
      </section>

      <section class="band" aria-labelledby="cred-h">
        <div class="wrap">
          <h2 id="cred-h" style="font-size:var(--step-2)" data-i18n="credits_title"></h2>
          <ul class="credits">
            <li><a href="https://www.sidc.be/SILSO/" target="_blank" rel="noopener" data-i18n="credit_silso"></a></li>

        </div>

    <!-- ===================== OBSERVATORIO ===================== -->
    <section class="view" data-view="observar" hidden aria-labelledby="obs-h">
      <div class="wrap">
        <header class="view-head">
          <h1 id="obs-h" data-i18n="obs_title"></h1>
          <p data-i18n="obs_intro"></p>
        </header>
        <div class="obs-grid">
          <div class="obs-stagecol">
            <form class="datebar" id="datebar">
              <label for="obs-date" data-i18n="date_label"></label>
              <div class="datebar-row">
                <input class="field" type="date" id="obs-date" required>
                <button type="submit" class="btn btn-primary" data-i18n="btn_load"></button>
                <button type="button" class="btn btn-secondary" id="btn-random" data-i18n="btn_random"></button>
              </div>
            </form>

            <div class="toolbar">
              <div class="seg seg-full" role="group" data-i18n-attr="aria-label:tool_aria">
                <button type="button" data-tool="spot" aria-pressed="true"><span class="sw sw-spot"></span><span data-i18n="tool_spot"></span></button>
                <button type="button" data-tool="group" aria-pressed="false"><span class="sw sw-group"></span><span data-i18n="tool_group"></span></button>
              </div>
              <div class="tool-row">
                <span class="seg-label" data-i18n="zoom_label"></span>
                <div class="seg" id="zoom-seg" role="group" data-i18n-attr="aria-label:zoom_aria"></div>
                <div class="tool-actions">
                  <button type="button" class="btn btn-quiet" id="btn-undo" data-i18n="btn_undo" disabled></button>
                  <button type="button" class="btn btn-quiet" id="btn-clear" data-i18n="btn_clear" disabled></button>
                </div>
              </div>
            </div>

            <div class="stage-wrap">
              <div class="stage" id="stage" tabindex="0" role="application" data-state="empty" data-i18n-attr="aria-label:disc_aria">
                <img id="sun-img" alt="" draggable="false" hidden>
                <div class="markers" id="markers"></div>
                <div class="kbd-cursor" id="kbd-cursor" hidden></div>
                <div class="lens" id="lens" data-side="left" hidden aria-hidden="true">
                  <div class="lens-view" id="lens-view"></div>
                  <div class="lens-marks" id="lens-marks"></div>
                  <svg class="lens-cross" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 27V43M50 57V73M27 50H43M57 50H73" fill="none" stroke="rgba(5,12,28,.8)" stroke-width="4.2" stroke-linecap="round"/><path d="M50 27V43M50 57V73M27 50H43M57 50H73" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
                  <span class="lens-zoom" id="lens-zoom"></span>
                </div>
                <p class="stage-msg" id="stage-msg" role="status"></p>
              </div>
              <p class="img-source" id="img-source"></p>
              <p class="hint" id="hint"></p>
            </div>
          </div>

          <div class="obs-calc">
            <div class="sheet">
              <h2 data-i18n="lbl_wolf"></h2>
              <div class="tally">
                <div><span class="lbl" data-i18n="lbl_groups"></span><span class="val val-g" id="out-g">0</span></div>
                <div><span class="lbl" data-i18n="lbl_spots"></span><span class="val val-s" id="out-s">0</span></div>
                <div class="kfield"><label class="lbl" for="k-input" data-i18n="lbl_k"></label><input class="field" type="number" inputmode="decimal" id="k-input" value="1"></div>
              </div>
              <p class="field-help" data-i18n="k_help"></p>
              <div class="result"><span class="lbl" data-i18n="lbl_wolf"></span><span class="r" id="out-r" aria-live="polite">0</span><span class="calc" id="out-calc"></span></div>
              <p class="warn" id="warn" hidden></p>
              <div class="save-row"><button type="button" class="btn btn-primary" id="btn-save" aria-disabled="true" data-i18n="btn_save"></button></div>
              <p class="saved-line"><span id="saved-count"></span><a href="#/datos" data-i18n="see_data"></a></p>
              <div class="pending"><button type="button" class="btn btn-secondary btn-small" id="k-pending-obs" data-i18n="k_pending_btn" hidden></button></div>
              <p class="visually-hidden" id="marks-live" aria-live="polite"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== DATOS ===================== -->
    <section class="view" data-view="datos" hidden aria-labelledby="data-h">
      <div class="wrap">
        <header class="view-head">
          <h1 id="data-h" data-i18n="data_title"></h1>
          <p data-i18n="data_intro"></p>

        <dl class="stats">
          <div><dt class="lbl" data-i18n="stat_obs"></dt><dd style="margin:0"><span class="val" id="stat-obs">0</span></dd></div>
          <div><dt class="lbl" data-i18n="stat_avg"></dt><dd style="margin:0"><span class="val" id="stat-avg">–</span></dd></div>
          <div><dt class="lbl"><label for="k-input-data" data-i18n="lbl_k"></label></dt><dd style="margin:0"><input class="field" type="number" inputmode="decimal" id="k-input-data" value="1"></dd></div>
        </dl>
        <div class="pending"><button type="button" class="btn btn-secondary btn-small" id="k-pending-data" data-i18n="k_pending_btn" hidden></button></div>

        <div class="chart-panel" id="chart-panel">
          <h2 style="font-size:var(--step-2)" data-i18n="chart_title"></h2>
          <div class="chart-controls" id="chart-controls">
            <label>
              <span data-i18n="var_label"></span>
              <select class="field" id="var-select"></select>
            </label>
            <div class="stack" style="gap:.25rem">
              <span class="seg-label" data-i18n="range_label"></span>
              <div class="seg" role="group" data-i18n-attr="aria-label:range_label">
                <button type="button" data-range="mine" aria-pressed="true" data-i18n="range_mine"></button>
                <button type="button" data-range="all" aria-pressed="false" data-i18n="range_all"></button>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="toggle-ref"><span data-i18n="toggle_ref"></span></label>
          </div>
          <div class="chart-frame">
            <div id="chart"></div>
            <div class="chart-empty" id="chart-empty" hidden>
              <h3 data-i18n="chart_empty_t"></h3>
              <p data-i18n="chart_empty_d"></p>

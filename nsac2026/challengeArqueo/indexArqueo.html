        // --- Core Functions ---
        function initApp() {
            document.getElementById('lang-selector').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateUIStrings();
                renderCurrentView(); // Ahora esto re-renderizará correctamente usando currentViewData
            });
            updateUIStrings();
            initStars();
            navigate('home');
        }

        // --- Sistema de Fondo Estrellado ---
        function initStars() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            
            function resizeAndDraw() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                drawStars(ctx, canvas.width, canvas.height);
            }
            
            window.addEventListener('resize', resizeAndDraw);
            resizeAndDraw();
        }

        function drawStars(ctx, width, height) {
            ctx.clearRect(0, 0, width, height);
            // Densidad de estrellas basada en la resolución
            const numStars = Math.floor((width * height) / 1200); 
            
            for(let i = 0; i < numStars; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                
                // Diámetros discretos estilo cartografía para magnitudes
                const sizes = [0.4, 0.7, 1.2, 1.6];
                const r = sizes[Math.floor(Math.random() * sizes.length)];
                
                // Distribución de colores requerida
                const colorRand = Math.random();
                let color = '#ffffff'; // 70% Blancas (Base)
                
                if (colorRand < 0.05) {
                    color = '#ff6666'; // 5% Rojas
                } else if (colorRand < 0.10) {
                    color = '#ffb366'; // 5% Naranjas
                } else if (colorRand < 0.20) {
                    color = '#ffffb3'; // 10% Blanco Amarillentas
                } else if (colorRand < 0.30) {
                    color = '#b3d9ff'; // 10% Celestes Pálidas
                }
                
                ctx.beginPath();
                ctx.arc(x, y, r, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                // Efecto muy sutil de brillo en estrellas más grandes
                if (r > 1) {
                    ctx.shadowBlur = 2;
                    ctx.shadowColor = color;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
            }
        }

        function updateUIStrings() {
            document.getElementById('ui-subtitle').innerText = t('subtitle');
            document.getElementById('ui-nav-home').innerText = t('navHome');
            document.getElementById('ui-nav-moon').innerText = t('navMoon');
            document.getElementById('ui-nav-mars').innerText = t('navMars');
            document.getElementById('ui-nav-trivia').innerText = t('navTrivia');
            document.getElementById('ui-nav-about').innerText = t('navAbout');
        }

        function navigate(view, data = null) {
            currentView = view;
            currentViewData = data; // Almacenamos el contexto actual
            
            // Update active state in nav
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-nasa-blue', 'text-white');
                btn.classList.add('text-gray-400');
                if (btn.dataset.target === view || (view === 'detail' && btn.dataset.target === data?.planet)) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-white');
                    btn.querySelector('i').classList.add('text-nasa-blue');
                } else {
                    btn.querySelector('i').classList.remove('text-nasa-blue');
                }
            });

            renderCurrentView();
        }

        function renderCurrentView() {
            const app = document.getElementById('app-content');
            const data = currentViewData;
            app.innerHTML = '';
            
            if (currentView === 'home') renderHome(app);
            else if (currentView === 'moon') renderList(app, 'moon');
            else if (currentView === 'mars') renderList(app, 'mars');
            else if (currentView === 'detail') renderDetail(app, data);
            else if (currentView === 'trivia') renderTriviaStart(app);
            else if (currentView === 'about') renderAbout(app);
            
            window.scrollTo(0, 0);
        }

        // --- Render Views ---
        function renderAbout(container) {
            container.innerHTML = `
                <div class="animate-fade-in pb-8 max-w-2xl mx-auto">
                    <h2 class="text-2xl md:text-3xl font-space font-bold mb-6 text-center" tabindex="0">${t('aboutTitle')}</h2>
                    
                    <section class="glass-card rounded-xl p-6 mb-6 border border-nasa-blue/30" aria-labelledby="a11y-heading">
                        <h3 id="a11y-heading" class="text-xl font-bold mb-3 flex items-center gap-3 text-blue-300">
                            <i class="fa-solid fa-universal-access text-2xl" aria-hidden="true"></i> Aviso de Accesibilidad
                        </h3>
                        <p class="text-gray-200 text-sm md:text-base leading-relaxed tracking-wide text-justify" tabindex="0">
                            ${t('aboutA11y')}
                        </p>
                    </section>

                    <section class="glass-card rounded-xl p-6 border border-gray-600" aria-labelledby="notes-heading">
                        <h3 id="notes-heading" class="text-xl font-bold mb-3 flex items-center gap-3 text-gray-300">
                            <i class="fa-solid fa-code-branch text-xl" aria-hidden="true"></i> Notas de Versión
                        </h3>
                        <ul class="list-disc pl-6 text-gray-300 text-sm space-y-3 mt-4 marker:text-nasa-blue">
                            <li tabindex="0">${t('aboutPlaceholder')}</li>
                            <li tabindex="0">${t('aboutPlaceholder')}</li>
                            <li tabindex="0">${t('aboutPlaceholder')}</li>
                        </ul>
                    </section>
                </div>
            `;
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="animate-fade-in flex flex-col items-center justify-center text-center mt-10 space-y-6">
                    <i class="fa-solid fa-satellite text-6xl text-gray-600 mb-4"></i>
                    <h2 class="text-3xl font-space font-bold text-white">${t('homeTitle')}</h2>
                    <p class="text-gray-300 max-w-lg leading-relaxed text-sm md:text-base">${t('homeDesc')}</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md mt-8">
                        <button onclick="navigate('moon')" class="glass-card py-4 px-6 rounded-xl hover:bg-space-800 transition-all font-semibold text-gray-200 border border-gray-600 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-moon"></i> ${t('btnExploreMoon')}
                        </button>
                        <button onclick="navigate('mars')" class="glass-card py-4 px-6 rounded-xl hover:bg-space-800 transition-all font-semibold text-gray-200 border border-gray-600 flex items-center justify-center gap-2">
                            <i class="fa-brands fa-galactic-senate text-red-400"></i> ${t('btnExploreMars')}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderList(container, planet) {
            const objects = spaceObjects.filter(obj => obj.planet === planet);
            const titleIcon = planet === 'moon' ? 'fa-moon' : 'fa-galactic-senate text-red-400';
            const titleText = planet === 'moon' ? t('navMoon') : t('navMars');

            let html = `
                <div class="animate-fade-in">
                    <div class="flex items-center gap-3 mb-6">
                        <i class="fa-solid ${titleIcon} text-2xl"></i>
                        <h2 class="text-2xl font-space font-bold capitalize">${titleText}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            objects.forEach(obj => {
                const img = obj.imageURL || FALLBACK_IMAGE;
                
                // Extracción de datos localizados
                const nameLoc = getLocText(obj, 'name');
                const missionLoc = getLocText(obj, 'mission');
                const dateLoc = getLocText(obj, 'date');
                const objLoc = getLocText(obj, 'objective');

                html += `
                    <div onclick="navigate('detail', '${obj.id}')" class="glass-card rounded-xl overflow-hidden cursor-pointer hover:scale-[1.02] transition-transform flex flex-col">
                        <div class="h-40 bg-gray-800 relative">
                            <img src="${img}" alt="${obj.imageAltText}" class="w-full h-full object-cover opacity-80" onerror="this.src='${FALLBACK_IMAGE}'">
                            <div class="absolute inset-0 bg-gradient-to-t from-space-900 to-transparent"></div>
                            <h3 class="absolute bottom-2 left-3 right-3 font-bold text-lg leading-tight text-white shadow-sm">${nameLoc}</h3>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <p class="text-xs text-nasa-red font-semibold mb-2">${missionLoc} &bull; ${dateLoc}</p>
                            <p class="text-sm text-gray-400 line-clamp-2">${objLoc}</p>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderDetail(container, id) {
            const obj = spaceObjects.find(o => o.id === id);
            if (!obj) return navigate('home');

            // Datos localizados
            const nameLoc = getLocText(obj, 'name');
            const missionLoc = getLocText(obj, 'mission');
            const dateLoc = getLocText(obj, 'date');
            const objLoc = getLocText(obj, 'objective');
            const contentLoc = getLocText(obj, 'content');

            const imgSrc = obj.imageURL || FALLBACK_IMAGE;
            const imgEditorNote = !obj.imageURL ? `<div class="bg-yellow-900/50 text-yellow-200 text-xs p-2 rounded-b-xl border-x border-b border-yellow-700/50"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${t('editorNoteImg')} ${obj.imageAltText}</div>` : '';
            
            const vidSrc = obj.videoID || FALLBACK_VIDEO_ID;
            const vidEditorNote = !obj.videoID ? `<div class="bg-yellow-900/50 text-yellow-200 text-xs p-2 rounded-b-xl border-x border-b border-yellow-700/50 mt-[-4px] mb-4 relative z-10"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${t('editorNoteVid')} ${obj.videoAltText}</div>` : '<div class="mb-4"></div>';

            let contentHtml = '';
            contentLoc.forEach(p => {
                contentHtml += `<p class="mb-4 text-gray-300 text-sm md:text-base leading-relaxed tracking-wide text-justify" tabindex="0">${p}</p>`;
            });

            // Map generation calculations (Equirectangular Projection)
            const mapImage = obj.planet === 'moon' 
                ? 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Moonmap_from_clementine_data.png/1024px-Moonmap_from_clementine_data.png'
                : 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Mars_equirectangular_projection.jpg/1024px-Mars_equirectangular_projection.jpg';
            
            const pinTop = ((90 - obj.lat) / 180) * 100;
            const pinLeft = ((obj.lng + 180) / 360) * 100;

            container.innerHTML = `
                <div class="animate-fade-in pb-8">
                    <button onclick="navigate('${obj.planet}')" class="text-sm text-gray-400 hover:text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> ${t('backBtn')}
                    </button>
                    
                    <h2 class="text-2xl md:text-3xl font-space font-bold mb-2" tabindex="0">${nameLoc}</h2>
                    
                    <div class="glass-card rounded-xl p-4 mb-6 text-sm">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div tabindex="0"><span class="text-gray-500">${t('missionLabel')}</span> <span class="font-semibold text-nasa-red">${missionLoc}</span></div>
                            <div tabindex="0"><span class="text-gray-500">${t('dateLabel')}</span> <span class="font-semibold">${dateLoc}</span></div>
                            <div class="sm:col-span-2" tabindex="0"><span class="text-gray-500">${t('coordsLabel')}</span> <span class="font-mono text-xs text-blue-300 ml-1">${obj.coords}</span></div>
                            <div class="sm:col-span-2 mt-1" tabindex="0"><span class="text-gray-500">${t('objectiveLabel')}</span> ${objLoc}</div>
                        </div>

                        <!-- Locator Map Area (ASPECT FIX) -->
                        <!-- Usando aspect-[2/1] y object-fill garantiza que la imagen equirectangular no se recorte y los % matemáticos coincidan -->
                        <div class="mt-4 relative w-full aspect-[2/1] bg-gray-900 rounded-lg overflow-hidden border border-gray-600 shadow-inner group" aria-label="Mapa cartográfico mostrando la ubicación">
                            <img src="${mapImage}" class="w-full h-full object-fill grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" alt="Mapa planetario cartográfico de ${obj.planet}">
                            
                            <!-- Pulsing Red Dot -->
                            <div class="absolute w-3 h-3 rounded-full bg-red-500 flex items-center justify-center shadow-[0_0_8px_rgba(255,0,0,0.8)]" style="top: ${pinTop}%; left: ${pinLeft}%; transform: translate(-50%, -50%);">
                                <div class="w-full h-full bg-red-500 rounded-full animate-ping opacity-75"></div>
                            </div>
                            
                            <!-- Crosshair Icon Overlay -->
                            <i class="fa-solid fa-crosshairs absolute text-white text-xl drop-shadow-[0_0_3px_black]" style="top: ${pinTop}%; left: ${pinLeft}%; transform: translate(-50%, -50%); pointer-events: none;" aria-hidden="true"></i>
                        </div>
                    </div>

                    <div class="mb-6 shadow-xl shadow-black/50">
                        <img src="${imgSrc}" class="w-full rounded-t-xl max-h-64 object-cover ${obj.imageURL ? 'rounded-b-xl' : ''}" alt="${obj.imageAltText}" onerror="this.src='${FALLBACK_IMAGE}'" tabindex="0">
                        ${imgEditorNote}
                    </div>

                    <div class="content-text font-serif">
                        ${contentHtml}
                    </div>

                    <div class="mt-8">
                        <div class="video-container shadow-xl shadow-black/50 ${obj.videoID ? 'rounded-xl' : 'rounded-t-xl'}">
                            <iframe src="https://www.youtube.com/embed/${vidSrc}?rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen tabindex="0" aria-label="Video del objeto"></iframe>
                        </div>
                        ${vidEditorNote}
                    </div>
                </div>
            `;
        }

        // --- Trivia Logic ---
        function renderTriviaStart(container) {
            container.innerHTML = `
                <div class="animate-fade-in flex flex-col items-center justify-center h-full min-h-[60vh] text-center px-4">
                    <i class="fa-solid fa-brain text-5xl text-purple-400 mb-6"></i>
                    <h2 class="text-3xl font-space font-bold mb-4">${t('triviaTitle')}</h2>
                    <p class="text-gray-400 max-w-md mb-8">${t('triviaDesc')}</p>
                    <button onclick="startTrivia()" class="bg-nasa-blue hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-blue-900/50 transition-transform transform hover:scale-105">
                        ${t('triviaStart')}
                    </button>
                </div>
            `;
        }

        function startTrivia() {
            // Shuffle and select 10 questions
            triviaQuestions = [...triviaDB].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            renderTriviaQuestion();
        }

        function renderTriviaQuestion() {
            const app = document.getElementById('app-content');
            const q = triviaQuestions[currentQuestionIndex];
            
            // Textos localizados de la Trivia
            const qText = getLocText(q, 'q');
            const optsLoc = getLocText(q, 'opts');
            
            let optionsHtml = '';
            optsLoc.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="selectTriviaAnswer(${idx})" class="w-full text-left glass-card p-4 rounded-xl hover:bg-space-700 border-gray-600 transition-colors mb-3 trivia-opt" data-idx="${idx}">
                        ${opt}
                    </button>
                `;
            });

            app.innerHTML = `
                <div class="animate-fade-in max-w-2xl mx-auto pt-4">
                    <div class="flex justify-between text-xs text-gray-500 mb-6 font-space tracking-widest uppercase">
                        <span tabindex="0">${t('triviaQuestionLabel')} ${currentQuestionIndex + 1} / 10</span>
                        <span tabindex="0">SCORE: ${score}</span>
                    </div>
                    
                    <h3 class="text-xl md:text-2xl font-semibold mb-8 leading-snug" tabindex="0">${qText}</h3>
                    
                    <div id="trivia-options" class="space-y-2">
                        ${optionsHtml}
                    </div>
                    
                    <div id="trivia-action" class="mt-8 hidden flex justify-end">
                        <button onclick="nextTriviaQuestion()" class="bg-white text-space-900 font-bold py-2 px-6 rounded-full">
                            ${currentQuestionIndex === 9 ? t('triviaFinishBtn') : t('triviaNextBtn')} <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectTriviaAnswer(idx) {
            const q = triviaQuestions[currentQuestionIndex];
            const isCorrect = idx === q.ans;
            
            if (isCorrect) score++;

            // Disable all options and show colors
            const buttons = document.querySelectorAll('.trivia-opt');
            buttons.forEach(btn => {
                btn.disabled = true;
                const btnIdx = parseInt(btn.dataset.idx);
                btn.classList.remove('hover:bg-space-700');
                
                if (btnIdx === q.ans) {
                    btn.classList.add('bg-green-900/50', 'border-green-500', 'text-green-100');
                    btn.innerHTML = `<i class="fa-solid fa-check mr-2 text-green-400"></i> ` + btn.innerText;
                } else if (btnIdx === idx && !isCorrect) {
                    btn.classList.add('bg-nasa-red/30', 'border-red-500', 'text-red-100');
                    btn.innerHTML = `<i class="fa-solid fa-xmark mr-2 text-red-400"></i> ` + btn.innerText;
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            document.getElementById('trivia-action').classList.remove('hidden');
        }

        function nextTriviaQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                renderTriviaQuestion();
            } else {
                renderTriviaResult();
            }
        }

        function renderTriviaResult() {
            const app = document.getElementById('app-content');
            const passed = score >= 5;
            const icon = passed ? 'fa-medal text-yellow-400' : 'fa-wrench text-gray-400';
            const msg = passed ? t('triviaWinMsg') : t('triviaLoseMsg');
            
            app.innerHTML = `
                <div class="animate-fade-in flex flex-col items-center justify-center text-center pt-10">
                    <i class="fa-solid ${icon} text-6xl mb-6 shadow-glow"></i>
                    <h2 class="text-3xl font-space font-bold mb-2">${t('triviaResultTitle')}</h2>
                    <div class="text-5xl font-bold font-mono text-nasa-blue mb-6">${score}<span class="text-2xl text-gray-500">/10</span></div>
                    
                    <p class="text-gray-300 max-w-md leading-relaxed mb-10 text-sm">${msg}</p>
                    
                    <button onclick="navigate('trivia')" class="glass-card py-3 px-8 rounded-full hover:bg-space-700 transition-colors font-bold text-white border-gray-600">
                        <i class="fa-solid fa-rotate-right mr-2"></i> ${t('triviaRetryBtn')}
                    </button>
                </div>
            `;
        }

        // Run
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
